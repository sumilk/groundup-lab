<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="la02-four-title la02-four-desc">
  <title id="la02-four-title">The four fundamental subspaces of the worked 3×4 matrix</title>
  <desc id="la02-four-desc">Schematic diagram. In R4, the row space (dimension 2, basis (1,2,0,1), (0,0,1,2)) and the null space (dimension 2, basis (−2,1,0,0), (−1,0,−2,1)) meet at a right angle. In R3, the column space (dimension 2, basis (1,2,1), (1,4,−1)) and the left null space (dimension 1, basis (−3,1,1)) meet at a right angle. An arrow sends the row-space vector (1,2,0,1) to A times it, (8,20,4), in the column space; another sends null-space vectors to 0.</desc>
  <rect width="900" height="450" rx="24" fill="#08111f"/>
  <text x="450" y="40" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">The four subspaces of A = [1 2 1 3; 2 4 4 10; 1 2 −1 −1], rank 2</text>
  <text x="210" y="78" fill="#a8b7ca" font-family="system-ui" font-size="16" text-anchor="middle">input space ℝ⁴</text>
  <rect x="80" y="100" width="220" height="130" rx="10" fill="#50d2c2" fill-opacity="0.16" stroke="#50d2c2" stroke-width="2.5" transform="rotate(-8 190 165)"/>
  <rect x="90" y="250" width="220" height="130" rx="10" fill="#d586ff" fill-opacity="0.16" stroke="#d586ff" stroke-width="2.5" transform="rotate(-8 200 315)"/>
  <text x="190" y="140" fill="#50d2c2" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">row space C(Aᵀ)</text>
  <text x="190" y="164" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">dimension r = 2</text>
  <text x="190" y="188" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">(1, 2, 0, 1), (0, 0, 1, 2)</text>
  <text x="200" y="300" fill="#d586ff" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">null space N(A)</text>
  <text x="200" y="324" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">dimension n − r = 2</text>
  <text x="200" y="348" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">(−2, 1, 0, 0), (−1, 0, −2, 1)</text>
  <path d="M292 226l14 -2l2 14" stroke="#91a4bb" stroke-width="2" fill="none"/>
  <text x="318" y="246" fill="#91a4bb" font-family="system-ui" font-size="13">90°</text>
  <text x="690" y="78" fill="#a8b7ca" font-family="system-ui" font-size="16" text-anchor="middle">output space ℝ³</text>
  <rect x="590" y="100" width="220" height="130" rx="10" fill="#ffb86b" fill-opacity="0.16" stroke="#ffb86b" stroke-width="2.5" transform="rotate(8 700 165)"/>
  <rect x="600" y="262" width="200" height="100" rx="10" fill="#ff7a90" fill-opacity="0.16" stroke="#ff7a90" stroke-width="2.5" transform="rotate(8 700 312)"/>
  <text x="700" y="140" fill="#ffb86b" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">column space C(A)</text>
  <text x="700" y="164" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">dimension r = 2</text>
  <text x="700" y="188" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">(1, 2, 1), (1, 4, −1)</text>
  <text x="700" y="300" fill="#ff7a90" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">left null space N(Aᵀ)</text>
  <text x="700" y="324" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">dimension m − r = 1</text>
  <text x="700" y="346" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">(−3, 1, 1)</text>
  <path d="M606 236l-12 -6l-4 13" stroke="#91a4bb" stroke-width="2" fill="none"/>
  <text x="612" y="250" fill="#91a4bb" font-family="system-ui" font-size="13">90°</text>
  <path d="M330 170H566" stroke="#50d2c2" stroke-width="2"/>
  <path d="M575 170L565 165L565 175Z" fill="#50d2c2"/>
  <text x="452.5" y="160" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">xᵣ = (1, 2, 0, 1) ↦ Axᵣ = (8, 20, 4)</text>
  <path d="M335 318C470 318 520 246 586 246" stroke="#d586ff" stroke-width="2" fill="none"/>
  <circle cx="594" cy="246" r="6" fill="#e8eef7"/>
  <text x="580" y="272" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="end">0 of ℝ³</text>
  <text x="430" y="344" fill="#d586ff" font-family="system-ui" font-size="14" text-anchor="middle">x_null in N(A) ↦ 0</text>
  <text x="200" y="405" fill="#a8b7ca" font-family="system-ui" font-size="15" text-anchor="middle">2 + 2 = 4 = n</text>
  <text x="700" y="405" fill="#a8b7ca" font-family="system-ui" font-size="15" text-anchor="middle">2 + 1 = 3 = m</text>
  <text x="450" y="430" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">A diagram, not to scale: the boxes stand for subspaces, and the right angles come from the dot product.</text>
</svg>
