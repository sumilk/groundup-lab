<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="la02-elem-title la02-elem-desc">
  <title id="la02-elem-title">Elementary matrices as maps of the plane</title>
  <desc id="la02-elem-desc">Three panels, each with the unit square dashed and its image shaded. The swap [[0,1],[1,0]] reflects the square across the line y = x. Scaling row 2 by 3, diag(1,3), stretches it to height 3. Subtracting 2 times row 1 from row 2, [[1,0],[−2,1]], shears it into the parallelogram with corners (0,0), (1,−2), (1,−1) and (0,1).</desc>
