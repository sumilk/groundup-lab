<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title desc">
  <title id="title">Bayesian updating combines prior information with likelihood information</title>
  <desc id="desc">A broad prior curve and a data likelihood curve combine to form a narrower posterior curve. The posterior balances their locations and precision.</desc>
  <rect width="960" height="410" rx="18" fill="#f7fbfc"/>
  <text x="480" y="38" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#173641">Posterior shape comes from prior × likelihood</text>
  <g transform="translate(55 82)">
    <line x1="0" y1="225" x2="245" y2="225" stroke="#476073" stroke-width="2"/>
    <path d="M8 225 C42 223 64 185 92 126 C120 68 148 72 176 132 C203 190 220 222 238 225" fill="#dfeff6" stroke="#438da8" stroke-width="4"/>
    <text x="122" y="18" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#356f84">prior</text>
    <text x="122" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">belief before these data</text>
  </g>
  <text x="329" y="207" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#476073">×</text>
  <g transform="translate(365 82)">
    <line x1="0" y1="225" x2="245" y2="225" stroke="#476073" stroke-width="2"/>
    <path d="M8 225 C90 224 120 216 143 166 C163 120 174 65 192 48 C211 75 218 151 228 195 C233 216 237 224 240 225" fill="#ffeadb" stroke="#d17a43" stroke-width="4"/>
    <text x="122" y="18" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#a35428">likelihood</text>
    <text x="122" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">support supplied by data</text>
  </g>
  <text x="638" y="207" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#476073">∝</text>
  <g transform="translate(675 82)">
    <line x1="0" y1="225" x2="245" y2="225" stroke="#476073" stroke-width="2"/>
    <path d="M8 225 C88 224 116 220 140 179 C162 141 177 68 194 52 C211 77 219 145 228 189 C234 215 238 224 241 225" fill="#daf1e8" stroke="#2d8a70" stroke-width="5"/>
    <line x1="194" y1="48" x2="194" y2="230" stroke="#2d8a70" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="122" y="18" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#246952">posterior</text>
    <text x="122" y="258" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">updated uncertainty</text>
  </g>
  <text x="480" y="376" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">Normalization turns the product into a probability distribution; it does not erase either assumption.</text>
</svg>
