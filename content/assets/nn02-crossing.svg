  <text x="339.67" y="216.98" fill="#e8eef7" font-family="system-ui" font-size="15">p + εu</text>
  <text x="140.33" y="325.02" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="end">p − εu</text>
  <circle cx="199.98" cy="177.33" r="6" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <circle cx="280.02" cy="352.67" r="6" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
