<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="nn02-cross-title nn02-cross-desc">
  <title id="nn02-cross-title">The crossing obstruction</title>
  <desc id="nn02-cross-desc">Left: two solid lines cross at a point p inside a small circle; the two opposite sectors where both units agree are shaded, as at a checkerboard crossing. A dashed third hidden line also passes through p. Two filled antipodal points p + εu and p − εu lie in the two shaded sectors, and a hollow antipodal pair lies in the unshaded sectors. Right: a table of θ(w·(x − p)) for the three lines through p at p + εu and p − εu; for every line one value is 1 and the other 0, so each sum is 1.</desc>
  <rect width="900" height="500" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">At a crossing, opposite points cancel every line through p</text>
