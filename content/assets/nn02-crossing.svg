  <text x="249" y="283" fill="#e8eef7" font-family="system-ui" font-size="16">p</text>
  <text x="64.26" y="226.48" fill="#50d2c2" font-family="system-ui" font-size="15">ℓ₁</text>
  <text x="323.89" y="107.92" fill="#50d2c2" font-family="system-ui" font-size="15">ℓ₂</text>
  <text x="393.12" y="432.08" fill="#7aa2f7" font-family="system-ui" font-size="15">ℓ₃ (hidden)</text>
  <text x="480" y="120" fill="#a8b7ca" font-family="system-ui" font-size="14">unit through p</text>
  <text x="630" y="120" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">at p+εu</text>
  <text x="720" y="120" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">at p−εu</text>
  <text x="800" y="120" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">sum</text>
  <path d="M480 130H830" stroke="#31445e" stroke-width="1.5" fill="none"/>
  <text x="480" y="158" fill="#50d2c2" font-family="system-ui" font-size="14">θ(w·(x−p)) on ℓ₁</text>
  <text x="630" y="158" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">1</text>
  <text x="720" y="158" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">0</text>
  <text x="800" y="158" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="600">1</text>
  <text x="480" y="188" fill="#50d2c2" font-family="system-ui" font-size="14">θ(w·(x−p)) on ℓ₂</text>
  <text x="630" y="188" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">1</text>
  <text x="720" y="188" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">0</text>
  <text x="800" y="188" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="600">1</text>
  <text x="480" y="218" fill="#7aa2f7" font-family="system-ui" font-size="14">θ(w·(x−p)) on ℓ₃</text>
  <text x="630" y="218" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">0</text>
  <text x="720" y="218" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">1</text>
  <text x="800" y="218" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="600">1</text>
  <text x="480" y="250" fill="#a8b7ca" font-family="system-ui" font-size="14">Each line through p puts exactly one of the pair</text>
  <text x="480" y="272" fill="#a8b7ca" font-family="system-ui" font-size="14">on its firing side, so the two output scores</text>
  <text x="480" y="294" fill="#a8b7ca" font-family="system-ui" font-size="14">add up to the same constant C for every u.</text>
  <text x="480" y="338" fill="#ff7a90" font-family="system-ui" font-size="14">● filled pair: both in the region ⇒ C ≥ 0</text>
  <text x="480" y="360" fill="#a8b7ca" font-family="system-ui" font-size="14">○ hollow pair: both outside ⇒ C &lt; 0</text>
  <text x="480" y="404" fill="#e8eef7" font-family="system-ui" font-size="14" font-weight="600">No single hidden layer can satisfy both.</text>
  <text x="450" y="480" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">z(p+εu) + z(p−εu) does not depend on u, yet the filled pair needs it ≥ 0 and the hollow pair &lt; 0.</text>
</svg>
