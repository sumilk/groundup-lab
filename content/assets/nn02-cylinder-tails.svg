<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="nn02-cyl-title nn02-cyl-desc">
  <title id="nn02-cyl-title">Cylinder tails add up along a row of discs</title>
  <desc id="nn02-cyl-desc">Total excess E(K), the sum over j from 0 to K−1 of arcsin(1/|1.5 − 3j|)/π, at the gap point x1 = 1.5 of a row of K unit discs centred at 0, 3, 6, …, for K from 1 to 200 on a logarithmic axis. A dashed line marks ½. E(2) = 0.465 lies below it; E(3) = 0.536 is the first value above it, so a point in a gap fires; E(100) = 0.949. On the logarithmic axis the curve keeps rising almost in a straight line.</desc>
