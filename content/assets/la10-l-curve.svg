<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="la10-lc-title la10-lc-desc">
  <title id="la10-lc-title">The L-curve and the error of three choices of lambda</title>
  <desc id="la10-lc-desc">Left: for the 32-channel problem, the solution norm against the residual norm on logarithmic axes, as lambda runs from 10 to the minus 16 to 1, makes an L shape. Its point of greatest curvature is at lambda about 3 times 10 to the minus 9. The discrepancy choice, lambda about 2.1 times 10 to the minus 6, and the best choice in hindsight, about 6.3 times 10 to the minus 7, lie a little further along the flat part. Right: the solution error against lambda. The corner choice has error 0.209, the discrepancy choice 0.039 and the best 0.033.</desc>
