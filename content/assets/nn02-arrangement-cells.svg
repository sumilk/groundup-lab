  <text x="838.14" y="299.29" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">10</text>
  <text x="739.54" y="344.24" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">11</text>
  <text x="792.5" y="395" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="600">4 lines: 11 cells</text>
  <text x="327" y="380" fill="#a8b7ca" font-family="system-ui" font-size="15" text-anchor="middle">cells for N = 0, 1, 2, 3, 4: 1, 2, 4, 7, 11 = 1 + N + N(N−1)/2</text>
  <text x="480" y="450" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">A new line meets the k−1 earlier lines in k−1 points, passes through k cells, and splits each one in two.</text>
</svg>
