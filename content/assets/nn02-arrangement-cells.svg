<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="nn02-arr-title nn02-arr-desc">
  <title id="nn02-arr-title">Cells of an arrangement of lines</title>
  <desc id="nn02-arr-desc">Five panels showing the same window as four lines in general position are added one at a time. The newest line is drawn in orange with dots where it crosses the earlier lines. The cells, found by intersecting the window with every combination of half-planes, are numbered in each panel: 1, 2, 4, 7, 11 cells for 0 to 4 lines. The last panel is drawn larger.</desc>
  <rect width="960" height="470" rx="24" fill="#08111f"/>
  <text x="480" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Each new line crosses every earlier one</text>
  <defs><clipPath id="clip-25-155"><rect x="25" y="155" width="140" height="140"/></clipPath></defs>
  <rect x="25" y="155" width="140" height="140" fill="#0d1a2b" stroke="#31445e" stroke-width="1.5"/>
  <text x="95" y="230" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">1</text>
  <text x="95" y="323" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle" font-weight="600">0 lines: 1 cell</text>
  <defs><clipPath id="clip-180-155"><rect x="180" y="155" width="140" height="140"/></clipPath></defs>
