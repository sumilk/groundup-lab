<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="la09-scale-title la09-scale-desc">
  <title id="la09-scale-title">Row scaling moves the difficulty from the matrix into the data</title>
  <desc id="la09-scale-desc">Left: A = diag(1, 1/2) maps the unit circle to a flat ellipse, and data errors form a small disk. Right: after scaling the second row by 2, the matrix image is a circle, but the same data errors, expressed in scaled units, form an ellipse twice as tall.</desc>
