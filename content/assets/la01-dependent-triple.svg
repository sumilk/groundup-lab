<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="la01-triple-title la01-triple-desc">
  <title id="la01-triple-title">Dependence means some vector adds no new direction</title>
  <desc id="la01-triple-desc">Left: an oblique view of the plane spanned by v1=(1,1,0) and v2=(0,1,1); v3=(1,3,2) equals v1 plus 2 v2 and lies in the plane, while (2,2,3) points out of it, three units above the plane point (2,2,0). Right: in the plane, (1,0), (0,1) and (1,1) are pairwise non-parallel, yet (1,1) is the sum of the other two.</desc>
