  <title id="la09-back-title">Backward error tilts and shifts the equations to pass through x̂</title>
  <desc id="la09-back-desc">Row picture for A = diag(1, 0.1) and b = (1, 0). The first row, the vertical line x = 1, is unchanged. The second row, originally the horizontal line y = 0, is tilted and shifted by a small change to its coefficients so that it passes through the candidate (1, 1).</desc>
