<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="dkw-title dkw-desc">
  <title id="dkw-title">A DKW band around the empirical CDF covers the whole true curve at once</title>
  <desc id="dkw-desc">A step function is the empirical CDF of sixty observations and a dashed curve is the true CDF, which lies inside a shaded band of constant half-width epsilon equal to the square root of log two over alpha divided by twice n. Because the band holds simultaneously at every x, a horizontal line at probability 0.75 crosses the upper and lower edges at two sample values, and the interval between them is a confidence interval for the 0.75 quantile. The band is finite-sample and distribution-free, and its constant width makes it conservative in the tails where the empirical CDF's binomial variance vanishes.</desc>
  <rect width="1080" height="500" rx="24" fill="#08111f"/>
  <g font-family="system-ui">
    <text x="540" y="42" text-anchor="middle" fill="#e8eef7" font-size="21">One inequality, every quantile, no distributional assumption</text>
    <text x="540" y="70" text-anchor="middle" fill="#91a4bb" font-size="15">n = 60, α = 0.05, so ε = √(ln(2/α) / 2n) = 0.175</text>

