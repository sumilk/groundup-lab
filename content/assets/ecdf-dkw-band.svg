    <text x="540" y="462" text-anchor="middle" fill="#e8eef7" font-size="16">Valid at every n, for every distribution, and simultaneously at every x — so you may choose where to look after seeing the data.</text>
    <text x="540" y="486" text-anchor="middle" fill="#91a4bb" font-size="15">The constant width is its one inefficiency: the true uncertainty shrinks to zero at both ends.</text>
