  <text x="450" y="410" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Reading [v]_B off the purple grid is solving 2c₁ − c₂ = 4, c₁ + c₂ = 5. The point did not move; only its description changed.</text>
