<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Conditioning as distortion of a unit circle</title>
  <desc id="desc">A linear map sends a unit circle to an ellipse with axes determined by singular values.</desc>
  <rect width="900" height="430" fill="#08111f" rx="24"/>
  <circle cx="225" cy="215" r="120" fill="#153047" stroke="#50d2c2" stroke-width="5"/>
  <ellipse cx="675" cy="215" rx="175" ry="55" fill="#2b2340" stroke="#d586ff" stroke-width="5"/>
  <path d="M380 215H500" stroke="#ffb86b" stroke-width="5"/><path d="M485 203l20 12-20 12" fill="#ffb86b"/>
  <path d="M500 215H850M675 85V345" stroke="#31445e" stroke-width="2"/>
  <path d="M675 215H850" stroke="#ffb86b" stroke-width="4"/><path d="M675 215V160" stroke="#50d2c2" stroke-width="4"/>
  <g fill="#e8eef7" font-family="system-ui" font-size="18"><text x="175" y="220">unit ball</text><text x="419" y="195">A</text><text x="760" y="200">σₘₐₓ</text><text x="687" y="165">σₘᵢₙ</text></g>
  <text x="450" y="405" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="17">κ₂(A) = σₘₐₓ / σₘᵢₙ: larger aspect ratio means greater sensitivity.</text>
</svg>
