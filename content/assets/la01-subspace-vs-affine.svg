<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="la01-affine-title la01-affine-desc">
  <title id="la01-affine-title">An affine line is a subspace translated away from the origin</title>
  <desc id="la01-affine-desc">The dashed purple line x+y=0 is the subspace S spanned by (−1,1). The teal line x+y=1 is S shifted by the anchor p=(1,0). The displacement q−p between two points on the teal line lies in S. The midpoint (1/2,1/2) stays on the teal line; the sum (1,1) leaves it.</desc>
