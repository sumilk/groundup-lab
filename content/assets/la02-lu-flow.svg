  <text x="439" y="390" fill="#ffb86b" font-family="system-ui" font-size="15" text-anchor="middle">L: the multipliers in place</text>
  <path d="M745 215C745 300 640 318 540 318" stroke="#ffb86b" stroke-width="2" fill="none"/>
  <path d="M530 318l11 -6v12z" fill="#ffb86b"/>
  <text x="700" y="300" fill="#ffb86b" font-family="system-ui" font-size="14">multiply U by L</text>
