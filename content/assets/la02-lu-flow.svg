<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="la02-lu-title la02-lu-desc">
  <title id="la02-lu-title">LU factorization records and undoes elimination</title>
  <desc id="la02-lu-desc">Top row: A = [2 1 1; 4 1 0; −2 2 1], then E21 A with the (2,1) entry cleared using multiplier 2, then E31 E21 A with the (3,1) entry cleared using multiplier −1, then U = [2 1 1; 0 −1 −2; 0 0 −4] with the (3,2) entry cleared using multiplier −3. Bottom: L = [1 0 0; 2 1 0; −1 −3 1] holds those multipliers in the positions they cleared, and multiplying U by L gives back A.</desc>
  <rect width="900" height="440" rx="24" fill="#08111f"/>
  <text x="450" y="40" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Elimination as E₃₂E₃₁E₂₁A = U, and its undoing A = LU</text>
