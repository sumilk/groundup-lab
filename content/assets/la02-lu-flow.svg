  <path d="M581 80H588V180H581" stroke="#91a4bb" stroke-width="2" fill="none"/>
  <text x="495" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">2</text>
  <text x="529" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
