  <text x="420" y="97" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">E₃₁: R₃ + R₁</text>
  <text x="420" y="115" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">ℓ₃₁ = −1</text>
  <path d="M594 125H677" stroke="#50d2c2" stroke-width="2"/>
  <path d="M686 125L676 120L676 130Z" fill="#50d2c2"/>
  <text x="640" y="97" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">E₃₂: R₃ + 3R₂</text>
  <text x="640" y="115" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">ℓ₃₂ = −3</text>
  <path d="M387 270H380V370H387" stroke="#91a4bb" stroke-width="2" fill="none"/>
  <path d="M491 270H498V370H491" stroke="#91a4bb" stroke-width="2" fill="none"/>
