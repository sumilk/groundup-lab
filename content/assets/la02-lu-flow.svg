  <text x="200" y="97" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">E₂₁: R₂ − 2R₁</text>
  <text x="200" y="115" fill="#50d2c2" font-family="system-ui" font-size="14" text-anchor="middle">ℓ₂₁ = 2</text>
  <path d="M374 125H457" stroke="#50d2c2" stroke-width="2"/>
