  <path d="M90 212l-6 12h12z" fill="#ffb86b"/>
  <text x="150" y="300" fill="#ffb86b" font-family="system-ui" font-size="14">…and recover A = LU</text>
  <text x="450" y="420" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Each highlighted entry is the one just cleared. L writes each multiplier where it was used; LU = A.</text>
</svg>
