  <text x="715" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">0</text>
  <text x="749" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">−1</text>
