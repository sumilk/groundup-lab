  <text x="473" y="295.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">0</text>
  <text x="405" y="325.6" fill="#ffb86b" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">2</text>
  <text x="439" y="325.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
