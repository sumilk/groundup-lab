  <text x="89" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="123" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="55" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">4</text>
  <text x="89" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="123" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">0</text>
  <text x="55" y="165.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">−2</text>
  <text x="89" y="165.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">2</text>
  <text x="123" y="165.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="89" y="200" fill="#a8b7ca" font-family="system-ui" font-size="15" text-anchor="middle">A</text>
  <path d="M257 80H250V180H257" stroke="#91a4bb" stroke-width="2" fill="none"/>
  <path d="M361 80H368V180H361" stroke="#91a4bb" stroke-width="2" fill="none"/>
  <text x="275" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">2</text>
  <text x="309" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="343" y="105.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="275" y="135.6" fill="#ffb86b" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">0</text>
  <text x="309" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">−1</text>
  <text x="343" y="135.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">−2</text>
  <text x="275" y="165.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">−2</text>
  <text x="309" y="165.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">2</text>
  <text x="343" y="165.6" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <text x="309" y="200" fill="#a8b7ca" font-family="system-ui" font-size="15" text-anchor="middle">E₂₁A</text>
