  <title id="la09-rows-title">An unstable solve lands on one equation and ignores the other</title>
  <desc id="la09-rows-desc">Two lines, the nearly horizontal first row and the diagonal second row, meet at (1,1). Elimination without row exchanges returns (0,1), which lies exactly on the first line but leaves a residual of 1 in the second equation.</desc>
