  <text x="690" y="150" fill="#a8b7ca" font-family="system-ui" font-size="15">For x/5 = (0.6, −0.8):</text>
  <text x="690" y="180" fill="#d586ff" font-family="system-ui" font-size="15">‖·‖₁ = 1.4  outside</text>
