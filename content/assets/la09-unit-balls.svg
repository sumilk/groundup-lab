  <title id="la09-balls-title">Unit balls of the 1-, 2-, and infinity norms</title>
  <desc id="la09-balls-desc">A diamond (1-norm), a disk (2-norm), and a square (infinity norm) are drawn as nested unit balls. The unit vector (0.6, −0.8) lies on the disk, outside the diamond, and inside the square.</desc>
