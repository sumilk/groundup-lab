  <text x="597.5" y="340.33" fill="#e8eef7" font-family="system-ui" font-size="16">x/5 = (0.6, −0.8)</text>
  <text x="60" y="150" fill="#d586ff" font-family="system-ui" font-size="18" font-weight="600">‖x‖₁ ≤ 1</text>
  <text x="60" y="176" fill="#d586ff" font-family="system-ui" font-size="15">diamond</text>
  <text x="60" y="226" fill="#50d2c2" font-family="system-ui" font-size="18" font-weight="600">‖x‖₂ ≤ 1</text>
  <text x="60" y="252" fill="#50d2c2" font-family="system-ui" font-size="15">disk</text>
  <text x="60" y="302" fill="#ffb86b" font-family="system-ui" font-size="18" font-weight="600">‖x‖∞ ≤ 1</text>
