  <text x="690" y="232" fill="#ffb86b" font-family="system-ui" font-size="15">‖·‖∞ = 0.8  inside</text>
  <text x="450" y="410" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">The diamond sits inside the disk, which sits inside the square: ‖x‖∞ ≤ ‖x‖₂ ≤ ‖x‖₁.</text>
