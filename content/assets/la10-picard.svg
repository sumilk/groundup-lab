<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="la10-picard-title la10-picard-desc">
  <title id="la10-picard-title">Picard plot and truncation error for a 32-channel problem</title>
  <desc id="la10-picard-desc">Left: on a logarithmic axis against channel number, the singular values fall steadily from 1 to 10 to the minus 8. The observed coefficients u_i transpose b fall faster at first, then level off near the noise level of about 1.8 times 10 to the minus 5 from channel 15 on. Their ratios to the singular values first decrease and then grow to several hundred. Right: the error of the truncated-SVD solution against the number of channels kept falls to its minimum 0.039 at k = 14 and then grows to about 960 when all 32 channels are kept.</desc>
