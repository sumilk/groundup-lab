<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="ic-title ic-desc">
  <title id="ic-title">Inverse CDF sampling for categorical weights</title>
  <desc id="ic-desc">A uniform draw on a line is mapped into one of three intervals whose lengths equal category probabilities.</desc>
  <rect width="980" height="400" rx="24" fill="#08111f"/>
  <text x="490" y="55" text-anchor="middle" fill="#e8eef7" font-family="system-ui" font-size="22">Draw U uniformly, then find its probability interval</text>
  <rect x="100" y="145" width="160" height="90" fill="#50d2c2" fill-opacity=".65"/><rect x="260" y="145" width="240" height="90" fill="#ffb86b" fill-opacity=".65"/><rect x="500" y="145" width="380" height="90" fill="#d586ff" fill-opacity=".65"/>
  <g stroke="#e8eef7" stroke-width="3"><path d="M100 250V130M260 250V130M500 250V130M880 250V130"/><path d="M100 250H880"/></g>
  <path d="M635 95V132" stroke="#ffffff" stroke-width="5"/><path d="M624 118l11 18 11-18" fill="#ffffff"/>
  <g fill="#e8eef7" font-family="system-ui" font-size="19" text-anchor="middle"><text x="180" y="197">class 0</text><text x="380" y="197">class 1</text><text x="690" y="197">class 2</text><text x="635" y="82">U</text></g>
  <g fill="#91a4bb" font-family="system-ui" font-size="17" text-anchor="middle"><text x="100" y="280">0</text><text x="260" y="280">0.2</text><text x="500" y="280">0.5</text><text x="880" y="280">1</text></g>
  <text x="490" y="345" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="18">Longer intervals are selected more often; the selected class is 2.</text>
</svg>
