<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Sufficient statistics compress samples without losing model information</title>
  <desc id="desc">Several Bernoulli sequences with three successes flow into a success-count statistic, which determines the likelihood under an iid Bernoulli model. A warning notes that time trends make order informative.</desc>
  <rect width="1000" height="430" rx="24" fill="#f4f8fa"/>
  <text x="500" y="38" text-anchor="middle" fill="#123246" font-family="system-ui" font-size="23" font-weight="700">Many samples, one likelihood-relevant summary</text>
  <g font-family="ui-monospace, monospace" font-size="22" text-anchor="middle">
    <rect x="70" y="78" width="300" height="52" rx="12" fill="#e2eef4" stroke="#438da8" stroke-width="3"/><text x="220" y="112" fill="#123246">1 0 1 1 0</text>
    <rect x="70" y="148" width="300" height="52" rx="12" fill="#e2eef4" stroke="#438da8" stroke-width="3"/><text x="220" y="182" fill="#123246">0 1 1 0 1</text>
    <rect x="70" y="218" width="300" height="52" rx="12" fill="#e2eef4" stroke="#438da8" stroke-width="3"/><text x="220" y="252" fill="#123246">1 1 0 0 1</text>
  </g>
  <g fill="none" stroke="#6c8290" stroke-width="3"><path d="M370 104 C430 104 435 180 485 180"/><path d="M370 174 H485"/><path d="M370 244 C430 244 435 180 485 180"/></g>
  <path d="M474 170 L490 180 L474 190" fill="none" stroke="#6c8290" stroke-width="3"/>
  <rect x="490" y="126" width="190" height="108" rx="18" fill="#dff2e9" stroke="#2d8a70" stroke-width="4"/>
  <text x="585" y="167" text-anchor="middle" fill="#195d4c" font-family="system-ui" font-size="20" font-weight="700">T(x) = Σxᵢ</text>
  <text x="585" y="202" text-anchor="middle" fill="#195d4c" font-family="system-ui" font-size="25">3 successes</text>
  <path d="M680 180 H747" fill="none" stroke="#6c8290" stroke-width="3"/><path d="M736 170 L752 180 L736 190" fill="none" stroke="#6c8290" stroke-width="3"/>
  <rect x="752" y="115" width="180" height="130" rx="18" fill="#eee7f5" stroke="#8069a0" stroke-width="4"/>
  <text x="842" y="154" text-anchor="middle" fill="#5d477a" font-family="system-ui" font-size="19" font-weight="700">Likelihood</text>
  <text x="842" y="190" text-anchor="middle" fill="#5d477a" font-family="system-ui" font-size="21">p³(1−p)²</text>
  <text x="842" y="220" text-anchor="middle" fill="#5d477a" font-family="system-ui" font-size="15">same for every row</text>
  <rect x="115" y="315" width="770" height="70" rx="16" fill="#ffeadb" stroke="#d17a43" stroke-width="3"/>
  <text x="500" y="344" text-anchor="middle" fill="#8a4d29" font-family="system-ui" font-size="17" font-weight="700">The compression is model-dependent</text>
  <text x="500" y="370" text-anchor="middle" fill="#8a4d29" font-family="system-ui" font-size="16">With drift or dependence, the order can carry information that Σxᵢ discards.</text>
</svg>
