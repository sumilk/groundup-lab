<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="la01-recipes-title la01-recipes-desc">
  <title id="la01-recipes-title">Dependent columns give several recipes for one vector</title>
  <desc id="la01-recipes-desc">With columns v1=(1,0), v2=(0,1), v3=(1,1), the target w=(5,4) is reached by the solid path 5 v1 then 4 v2, and by the dashed path 4 v1, 3 v2, then one v3. The two coefficient lists differ by (−1,−1,1), a relation among the columns.</desc>
