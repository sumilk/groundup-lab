<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="la10-two-title la10-two-desc">
  <title id="la10-two-title">Least squares, then minimum norm</title>
  <desc id="la10-two-desc">Left: in observation space, y = (1, 0) is projected onto the line of multiples of (1, 2), giving (1/5, 2/5) and a perpendicular residual. Right: in parameter space, every w with w1 + w2 = 1/5 produces that projection; the shortest one, (1/10, 1/10), is where the row-space line of multiples of (1, 1) crosses at right angles. The point (1/5, 0) obtained by setting w2 to zero is also marked.</desc>
