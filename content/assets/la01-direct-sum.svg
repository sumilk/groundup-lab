<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="la01-dsum-title la01-dsum-desc">
  <title id="la01-dsum-title">A direct sum splits each vector once; a sum with overlap does not</title>
  <desc id="la01-dsum-desc">Left: an oblique view of the plane U spanned by (1,1,0) and (0,1,1) and the line Y spanned by (1,0,1). The vector x=(3,4,5) is the diagonal of the parallelogram on u=(1,4,3) in U and w=(2,0,2) in Y. Right: the planes z=0 and x=0 meet along the y-axis, so their sum is all of three-space but has dimension 2+2−1.</desc>
  <rect width="920" height="440" rx="24" fill="#08111f"/>
  <defs><clipPath id="clip-30-70"><rect x="74.45" y="70" width="331.1" height="300"/></clipPath></defs>
  <text x="240" y="56" fill="#a8b7ca" font-family="system-ui" font-size="17" text-anchor="middle">ℝ³ = U ⊕ Y: one way to split x</text>
  <path d="M143.55 280.95L181.01 346.86L382.41 165.04L344.95 99.13Z" fill="#d586ff" fill-opacity="0.18" stroke="#d586ff" stroke-width="1.5"/>
  <path d="M181.68 271.45L110.53 307.54" stroke="#31445e" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <text x="100.83" y="315.42" fill="#91a4bb" font-family="system-ui" font-size="15">x</text>
  <path d="M181.68 271.45L287.18 295.79" stroke="#31445e" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <text x="291.62" y="302.74" fill="#91a4bb" font-family="system-ui" font-size="15">y</text>
  <path d="M181.68 271.45L181.68 151.87" stroke="#31445e" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
  <text x="177.68" y="147.31" fill="#91a4bb" font-family="system-ui" font-size="15">z</text>
  <path d="M207.56 301.82L181.68 271.45" stroke="#ffb86b" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <path d="M181.68 271.45L97.59 172.78" stroke="#ffb86b" stroke-width="3" fill="none"/>
  <text x="147.56" y="323.82" fill="#ffb86b" font-family="system-ui" font-size="14">Y = span{(1, 0, 1)}, dashed below U</text>
  <text x="350.95" y="119.13" fill="#d586ff" font-family="system-ui" font-size="18">U</text>
  <path d="M341.15 169.04L276.46 93.14" stroke="#91a4bb" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <path d="M116.99 195.55L276.46 93.14" stroke="#91a4bb" stroke-width="2" stroke-dasharray="5 5" fill="none"/>
  <path d="M181.68 271.45L330.22 176.07" stroke="#50d2c2" stroke-width="4" stroke-linecap="round"/>
  <path d="M341.15 169.04L333.38 180.99L327.05 171.15Z" fill="#50d2c2"/>
  <text x="347.15" y="187.04" fill="#50d2c2" font-family="system-ui" font-size="16">u = (1, 4, 3)</text>
  <path d="M181.68 271.45L125.43 205.44" stroke="#ffb86b" stroke-width="4" stroke-linecap="round"/>
  <path d="M116.99 195.55L129.88 201.65L120.97 209.24Z" fill="#ffb86b"/>
  <text x="16.99" y="217.55" fill="#ffb86b" font-family="system-ui" font-size="16">w = (2, 0, 2)</text>
  <path d="M181.68 271.45L270.36 104.62" stroke="#e8eef7" stroke-width="3" stroke-linecap="round"/>
  <path d="M276.46 93.14L275.53 107.36L265.2 101.87Z" fill="#e8eef7"/>
  <text x="284.46" y="87.14" fill="#e8eef7" font-family="system-ui" font-size="16">x = (3, 4, 5)</text>
  <defs><clipPath id="clip-470-70"><rect x="523.25" y="70" width="313.49" height="300"/></clipPath></defs>
  <text x="680" y="56" fill="#a8b7ca" font-family="system-ui" font-size="17" text-anchor="middle">U + Y not direct: overlap counted twice</text>
  <path d="M610.67 248.44L516.41 296.23L714.39 341.91L808.65 294.11Z" fill="#50d2c2" fill-opacity="0.16" stroke="#50d2c2" stroke-width="1.5"/>
  <path d="M610.67 248.44L808.65 294.11L808.65 135.71L610.67 90.03Z" fill="#ffb86b" fill-opacity="0.16" stroke="#ffb86b" stroke-width="1.5"/>
  <path d="M610.67 248.44L808.65 294.11" stroke="#ff7a90" stroke-width="5" fill="none"/>
  <text x="521.35" y="326.29" fill="#50d2c2" font-family="system-ui" font-size="15">U: z = 0</text>
  <text x="653.61" y="102.09" fill="#ffb86b" font-family="system-ui" font-size="15">Y: x = 0</text>
  <text x="768.65" y="280.11" fill="#ff7a90" font-family="system-ui" font-size="15">U ∩ Y = y-axis</text>
  <text x="460" y="420" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Left: U ∩ Y = {0}, so x = u + w in exactly one way. Right: dim(U + Y) = 2 + 2 − 1 = 3; the shared line allows many splittings.</text>
</svg>
