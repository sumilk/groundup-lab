<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="nn02-width-title nn02-width-desc">
  <title id="nn02-width-title">A one-unit first layer collapses a direction</title>
  <desc id="nn02-width-desc">Left: on the square from −1 to 1, circular level sets of x1² + x2², with the unit circle highlighted; the origin is marked with target value 0 and the unit vector v = (2, −1)/√5 on the unit circle with target value 1. Right: the level sets of any network whose first layer is one unit with weight vector w = (1, 2)/√5: parallel lines perpendicular to w, drawn with an arrow for w and a right-angle mark. The origin and v lie on the same highlighted line, so the network gives them the same value.</desc>
  <rect width="900" height="490" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">A one-unit first layer cannot tell 0 from v</text>
  <defs><clipPath id="clip-60-90"><rect x="60" y="90" width="300" height="300"/></clipPath></defs>
