<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="nn02-bneck-title nn02-bneck-desc">
  <title id="nn02-bneck-title">Irreducible error from a missing line</title>
  <desc id="nn02-bneck-desc">The 3+3 checkerboard on the window from 0 to 4, with target cells (k + m odd) shaded. Five first-layer lines are drawn solid: x1 = 1 and 3, and x2 = 1, 2 and 3; the line x1 = 2 is dashed because it is missing from the first layer. The two middle columns therefore merge, giving 12 code regions: 8 single cells and 4 merged pairs spanning x1 from 1 to 3 in each row, outlined in orange. Each merged pair is half target and half not, so it costs area 1 whatever the later layers do. Computed on a 400-by-400 grid, the floor is 4 out of 16.</desc>
  <rect width="900" height="510" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">A missing first-layer line sets an error floor</text>
  <defs><clipPath id="clip-50-80"><rect x="50" y="80" width="360" height="360"/></clipPath></defs>
  <path d="M140.0 350.0H230.0V440.0H140.0ZM320.0 350.0H410.0V440.0H320.0ZM50.0 260.0H140.0V350.0H50.0ZM230.0 260.0H320.0V350.0H230.0ZM140.0 170.0H230.0V260.0H140.0ZM320.0 170.0H410.0V260.0H320.0ZM50.0 80.0H140.0V170.0H50.0ZM230.0 80.0H320.0V170.0H230.0Z" fill="#ff7a90" fill-opacity="0.4"/>
  <path d="M140 440L140 80" stroke="#50d2c2" stroke-width="2.5" fill="none"/>
  <path d="M320 440L320 80" stroke="#50d2c2" stroke-width="2.5" fill="none"/>
  <path d="M50 350L410 350" stroke="#50d2c2" stroke-width="2.5" fill="none"/>
  <path d="M50 260L410 260" stroke="#50d2c2" stroke-width="2.5" fill="none"/>
  <path d="M50 170L410 170" stroke="#50d2c2" stroke-width="2.5" fill="none"/>
  <path d="M230 440L230 80" stroke="#a8b7ca" stroke-width="2" stroke-dasharray="4 6" fill="none"/>
  <path d="M145.4 434.6L314.6 434.6L314.6 355.4L145.4 355.4Z" fill="#ffb86b" fill-opacity="0.16" stroke="#ffb86b" stroke-width="3"/>
  <rect x="198" y="383" width="64" height="22" rx="6" fill="#08111f" stroke="#ffb86b" stroke-width="1.2"/>
  <text x="230" y="399" fill="#ffb86b" font-family="system-ui" font-size="13" text-anchor="middle">error 1</text>
  <path d="M145.4 344.6L314.6 344.6L314.6 265.4L145.4 265.4Z" fill="#ffb86b" fill-opacity="0.16" stroke="#ffb86b" stroke-width="3"/>
  <rect x="198" y="293" width="64" height="22" rx="6" fill="#08111f" stroke="#ffb86b" stroke-width="1.2"/>
  <text x="230" y="309" fill="#ffb86b" font-family="system-ui" font-size="13" text-anchor="middle">error 1</text>
  <path d="M145.4 254.6L314.6 254.6L314.6 175.4L145.4 175.4Z" fill="#ffb86b" fill-opacity="0.16" stroke="#ffb86b" stroke-width="3"/>
  <rect x="198" y="203" width="64" height="22" rx="6" fill="#08111f" stroke="#ffb86b" stroke-width="1.2"/>
  <text x="230" y="219" fill="#ffb86b" font-family="system-ui" font-size="13" text-anchor="middle">error 1</text>
  <path d="M145.4 164.6L314.6 164.6L314.6 85.4L145.4 85.4Z" fill="#ffb86b" fill-opacity="0.16" stroke="#ffb86b" stroke-width="3"/>
  <rect x="198" y="113" width="64" height="22" rx="6" fill="#08111f" stroke="#ffb86b" stroke-width="1.2"/>
  <text x="230" y="129" fill="#ffb86b" font-family="system-ui" font-size="13" text-anchor="middle">error 1</text>
  <rect x="50" y="80" width="360" height="360" fill="none" stroke="#31445e" stroke-width="2"/>
  <text x="50" y="460" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">0</text>
  <text x="42" y="445" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">0</text>
  <text x="140" y="460" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">1</text>
  <text x="42" y="355" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">1</text>
  <text x="230" y="460" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">2</text>
  <text x="42" y="265" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">2</text>
  <text x="320" y="460" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">3</text>
  <text x="42" y="175" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">3</text>
  <text x="410" y="460" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">4</text>
  <text x="42" y="85" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">4</text>
  <text x="418" y="460" fill="#a8b7ca" font-family="system-ui" font-size="14">x₁</text>
  <text x="230" y="72" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">x₁ = 2 missing</text>
  <text x="470" y="120" fill="#50d2c2" font-family="system-ui" font-size="15">first layer: 5 line units</text>
  <text x="470" y="144" fill="#a8b7ca" font-family="system-ui" font-size="15">x₁ = 1, 3 and x₂ = 1, 2, 3 (solid)</text>
  <text x="470" y="168" fill="#a8b7ca" font-family="system-ui" font-size="15">x₁ = 2 is not in the first layer (dashed)</text>
  <text x="470" y="216" fill="#e8eef7" font-family="system-ui" font-size="15">12 code regions:</text>
  <text x="470" y="240" fill="#a8b7ca" font-family="system-ui" font-size="15">8 single cells, error 0</text>
  <text x="470" y="264" fill="#ffb86b" font-family="system-ui" font-size="15">4 merged pairs, half in, half out:</text>
  <text x="470" y="288" fill="#ffb86b" font-family="system-ui" font-size="15">min(A¹, A⁰) = 1 each, whatever g does</text>
  <text x="470" y="336" fill="#ff7a90" font-family="system-ui" font-size="15">shaded pink: target cells (k + m odd)</text>
  <rect x="460" y="372" width="330" height="46" rx="10" fill="#08111f" stroke="#ffb86b" stroke-width="2.2"/>
  <text x="625" y="401" fill="#e8eef7" font-family="system-ui" font-size="17" text-anchor="middle" font-weight="600">irreducible error = 4 (of 16)</text>
  <text x="450" y="490" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Later layers see only the code, so each merged region gets one label: at least a quarter of the window is wrong.</text>
</svg>
