<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="nn01-mpg-title nn01-mpg-desc">
  <title id="nn01-mpg-title">McCulloch–Pitts building blocks</title>
  <desc id="nn01-mpg-desc">Four small nets. Delay: one excitatory input into a unit with threshold 1. OR: two excitatory inputs, threshold 1. AND: two excitatory inputs, threshold 2. AND-NOT: A excitatory and B inhibitory, threshold 1. A legend shows arrows for excitatory synapses and bars for inhibitory ones.</desc>
  <rect width="900" height="440" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">McCulloch–Pitts building blocks (one step of delay each)</text>
  <circle cx="50" cy="210" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="50" y="215" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A</text>
  <path d="M64 210L114 210" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M124 210L114 215L114 205Z" fill="#50d2c2"/>
  <circle cx="150" cy="210" r="24" fill="#08111f" stroke="#ffb86b" stroke-width="2.4"/>
  <text x="150" y="215" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <path d="M174 210L215 210" stroke="#e8eef7" stroke-width="2.2" fill="none"/><path d="M225 210L215 215L215 205Z" fill="#e8eef7"/>
  <text x="208" y="196" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A(t−1)</text>
  <circle cx="255" cy="170" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="255" y="175" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A</text>
  <circle cx="255" cy="250" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="255" y="255" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">B</text>
  <path d="M269 170L325.9 195.86" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M335 200L323.83 200.41L327.97 191.31Z" fill="#50d2c2"/>
  <path d="M269 250L325.9 224.14" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M335 220L327.97 228.69L323.83 219.59Z" fill="#50d2c2"/>
  <circle cx="355" cy="210" r="24" fill="#08111f" stroke="#ffb86b" stroke-width="2.4"/>
  <text x="355" y="215" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <path d="M379 210L420 210" stroke="#e8eef7" stroke-width="2.2" fill="none"/><path d="M430 210L420 215L420 205Z" fill="#e8eef7"/>
  <text x="413" y="196" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A ∨ B</text>
  <circle cx="460" cy="170" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="460" y="175" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A</text>
  <circle cx="460" cy="250" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="460" y="255" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">B</text>
  <path d="M474 170L530.9 195.86" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M540 200L528.83 200.41L532.97 191.31Z" fill="#50d2c2"/>
  <path d="M474 250L530.9 224.14" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M540 220L532.97 228.69L528.83 219.59Z" fill="#50d2c2"/>
  <circle cx="560" cy="210" r="24" fill="#08111f" stroke="#ffb86b" stroke-width="2.4"/>
  <text x="560" y="215" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">2</text>
  <path d="M584 210L625 210" stroke="#e8eef7" stroke-width="2.2" fill="none"/><path d="M635 210L625 215L625 205Z" fill="#e8eef7"/>
  <text x="618" y="196" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A ∧ B</text>
  <circle cx="665" cy="170" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="665" y="175" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A</text>
  <circle cx="665" cy="250" r="14" fill="#08111f" stroke="#a8b7ca" stroke-width="2.4"/>
  <text x="665" y="255" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">B</text>
  <path d="M679 170L735.9 195.86" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M745 200L733.83 200.41L737.97 191.31Z" fill="#50d2c2"/>
  <path d="M679 250L737 224" stroke="#ff7a90" stroke-width="2.2"/><path d="M740.68 232.21L733.32 215.79" stroke="#ff7a90" stroke-width="4"/>
  <circle cx="765" cy="210" r="24" fill="#08111f" stroke="#ffb86b" stroke-width="2.4"/>
  <text x="765" y="215" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">1</text>
  <path d="M789 210L830 210" stroke="#e8eef7" stroke-width="2.2" fill="none"/><path d="M840 210L830 215L830 205Z" fill="#e8eef7"/>
  <text x="823" y="196" fill="#e8eef7" font-family="system-ui" font-size="13" text-anchor="middle">A ∧ ¬B</text>
  <text x="130" y="320" fill="#e8eef7" font-family="system-ui" font-size="18" text-anchor="middle" font-weight="600">delay</text>
  <text x="335" y="320" fill="#e8eef7" font-family="system-ui" font-size="18" text-anchor="middle" font-weight="600">OR</text>
  <text x="540" y="320" fill="#e8eef7" font-family="system-ui" font-size="18" text-anchor="middle" font-weight="600">AND</text>
  <text x="745" y="320" fill="#e8eef7" font-family="system-ui" font-size="18" text-anchor="middle" font-weight="600">AND-NOT</text>
  <text x="130" y="344" fill="#91a4bb" font-family="system-ui" font-size="13" text-anchor="middle">copies its input</text>
  <text x="335" y="344" fill="#91a4bb" font-family="system-ui" font-size="13" text-anchor="middle">threshold 1</text>
  <text x="540" y="344" fill="#91a4bb" font-family="system-ui" font-size="13" text-anchor="middle">threshold 2</text>
  <text x="745" y="344" fill="#91a4bb" font-family="system-ui" font-size="13" text-anchor="middle">B is a veto</text>
  <path d="M300 380L340 380" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M350 380L340 385L340 375Z" fill="#50d2c2"/>
  <text x="360" y="385" fill="#a8b7ca" font-family="system-ui" font-size="13">excitatory</text>
  <path d="M470 380L520 380" stroke="#ff7a90" stroke-width="2.2"/><path d="M520 389L520 371" stroke="#ff7a90" stroke-width="4"/>
  <text x="535" y="385" fill="#a8b7ca" font-family="system-ui" font-size="13">inhibitory (absolute veto)</text>
  <text x="450" y="420" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Numbers in the circles are thresholds. Wire these four blocks together and any logical formula can be built.</text>
</svg>
