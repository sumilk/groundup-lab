name: Validate and deploy theory
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate reader from Markdown
        run: node scripts/build-theory.mjs
      - name: Check lessons and reader
        run: node scripts/check-theory.mjs
      - name: Check lab reference behavior
        run: python -m labs.checks --reference
      - name: Check private hosting boundary
        run: node scripts/check-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: theory-site
          path: public/
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_THEORY_SITE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: theory-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: theory-site
          path: public/
      - name: Skip outdated commits
        id: current
        run: |
          REMOTE_HEAD="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$REMOTE_HEAD" = "$GITHUB_SHA" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skipping this deployment."
          fi
      - name: Validate hosting configuration
        if: steps.current.outputs.is_current == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READER_USERNAME: ${{ secrets.READER_USERNAME }}
          READER_PASSWORD: ${{ secrets.READER_PASSWORD }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing Cloudflare API token"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing Cloudflare account ID"; exit 1; }
          test -n "$READER_USERNAME" || { echo "Missing reader username"; exit 1; }
          test -n "$READER_PASSWORD" || { echo "Missing reader password"; exit 1; }
      - name: Publish tested reader artifact
        if: steps.current.outputs.is_current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          workingDirectory: deploy
          command: deploy
          secrets: |
            READER_USERNAME
            READER_PASSWORD
        env:
          READER_USERNAME: ${{ secrets.READER_USERNAME }}
          READER_PASSWORD: ${{ secrets.READER_PASSWORD }}
