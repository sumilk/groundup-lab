name: Publish public learning reader
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: public-site
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and validate public lessons
        run: |
          node scripts/build-theory.mjs
          node scripts/check-theory.mjs
          python -m labs.checks --reference
          python scripts/check_browser_labs.py
      - name: Stage ONLY the static lesson reader
        run: |
          mkdir -p public-release/theory
          cp -a public/theory/. public-release/theory/
          test -f public-release/theory/index.html
          test -f public-release/theory/catalog.json
          test -f public-release/theory/lab-runtime.json
      - name: Deploy public static reader
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          workingDirectory: deploy-public
          command: deploy
