<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="cc-title cc-desc">
  <title id="cc-title">Reliability diagrams measure calibration; split conformal converts calibration scores into a coverage guarantee</title>
  <desc id="cc-desc">Left panel: a reliability diagram plots observed outcome frequency against predicted probability, with the diagonal marking perfect calibration and a curve falling below it marking an overconfident model. Right panel: calibration nonconformity scores are sorted along a line, and the threshold is placed at the rank given by the ceiling of n plus one times one minus alpha, so that at least that fraction of future scores falls below it.</desc>
  <rect width="1080" height="460" rx="24" fill="#08111f"/>
  <g font-family="system-ui">
    <text x="540" y="40" text-anchor="middle" fill="#e8eef7" font-size="21">Two different promises about a prediction</text>

    <g>
      <text x="110" y="80" fill="#e8eef7" font-size="18">Calibration: are the probabilities honest?</text>
      <text x="110" y="102" fill="#91a4bb" font-size="14">needs the model to be right</text>

      <path d="M120 390V130" stroke="#31445e" stroke-width="3"/>
      <path d="M120 390H440" stroke="#31445e" stroke-width="3"/>
      <text x="280" y="418" text-anchor="middle" fill="#91a4bb" font-size="14">predicted probability</text>
      <text x="100" y="260" fill="#91a4bb" font-size="14" transform="rotate(-90 100 260)" text-anchor="middle">observed rate</text>

      <path d="M120 390L440 130" stroke="#91a4bb" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="386" y="150" fill="#91a4bb" font-size="14" text-anchor="end">perfect</text>

      <path d="M120 388C190 360 260 330 360 274C400 250 420 232 438 216" fill="none" stroke="#50d2c2" stroke-width="4"/>
      <g fill="#50d2c2">
        <circle cx="152" cy="376" r="5"/><circle cx="216" cy="348" r="5"/>
        <circle cx="280" cy="312" r="5"/><circle cx="344" cy="280" r="5"/>
        <circle cx="408" cy="234" r="5"/>
      </g>
      <text x="300" y="352" fill="#50d2c2" font-size="15">overconfident</text>
    </g>

    <g>
      <text x="610" y="80" fill="#e8eef7" font-size="18">Coverage: is the true answer in the set?</text>
      <text x="610" y="102" fill="#91a4bb" font-size="14">needs only exchangeability</text>

      <rect x="610" y="196" width="292" height="56" rx="10" fill="#50d2c2" fill-opacity=".14"/>
      <path d="M610 224H1010" stroke="#31445e" stroke-width="3"/>
      <g fill="#7aa2f7">
        <circle cx="626" cy="224" r="6"/><circle cx="660" cy="224" r="6"/><circle cx="690" cy="224" r="6"/>
        <circle cx="722" cy="224" r="6"/><circle cx="756" cy="224" r="6"/><circle cx="788" cy="224" r="6"/>
        <circle cx="820" cy="224" r="6"/><circle cx="854" cy="224" r="6"/><circle cx="884" cy="224" r="6"/>
      </g>
      <g fill="#31445e">
        <circle cx="928" cy="224" r="6"/><circle cx="968" cy="224" r="6"/>
      </g>
      <path d="M902 178V270" stroke="#50d2c2" stroke-width="4"/>
      <text x="902" y="166" text-anchor="middle" fill="#50d2c2" font-size="16">q̂</text>
      <text x="756" y="290" text-anchor="middle" fill="#e8eef7" font-size="15">rank ⌈(n+1)(1−α)⌉</text>
      <text x="610" y="330" fill="#91a4bb" font-size="14">sorted calibration scores, smallest to largest</text>
      <text x="610" y="366" fill="#e8eef7" font-size="15">P(Y ∈ C(X)) ≥ 1 − α, whatever the model does</text>
      <text x="610" y="394" fill="#91a4bb" font-size="14">validity is free; small sets are not</text>
    </g>
  </g>
</svg>
