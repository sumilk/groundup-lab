<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Testing decisions crossed with whether the null hypothesis is true</title>
  <desc id="desc">A two-by-two table shows correct non-rejection, Type I error, Type II error, and correct rejection or power.</desc>
  <rect width="920" height="430" rx="18" fill="#f7fbfc"/>
  <text x="510" y="38" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#173641">A decision has two possible realities</text>
  <text x="370" y="79" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#35566a">Null is true</text>
  <text x="680" y="79" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#35566a">Meaningful alternative is true</text>
  <text x="112" y="178" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#35566a">Do not reject</text>
  <text x="112" y="323" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#35566a">Reject</text>
  <rect x="220" y="98" width="290" height="130" rx="12" fill="#dff4ec" stroke="#3d8c72" stroke-width="2"/>
  <rect x="530" y="98" width="290" height="130" rx="12" fill="#fff0d6" stroke="#be7a26" stroke-width="2"/>
  <rect x="220" y="248" width="290" height="130" rx="12" fill="#ffe2e2" stroke="#a84e56" stroke-width="2"/>
  <rect x="530" y="248" width="290" height="130" rx="12" fill="#dff4ec" stroke="#3d8c72" stroke-width="2"/>
  <text x="365" y="147" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#245f4e">Correct non-rejection</text>
  <text x="365" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#245f4e">probability 1 − α</text>
  <text x="675" y="147" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#875717">Type II error</text>
  <text x="675" y="176" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#875717">probability β at this alternative</text>
  <text x="365" y="297" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#81363d">Type I error</text>
  <text x="365" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#81363d">probability at most α</text>
  <text x="675" y="297" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#245f4e">Correct rejection</text>
  <text x="675" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#245f4e">power = 1 − β</text>
  <text x="510" y="410" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">Non-rejection is not proof of the null: the procedure may simply have low power.</text>
</svg>
