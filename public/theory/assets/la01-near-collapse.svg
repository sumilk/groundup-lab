  <title id="la01-near-title">Nearly parallel basis vectors can force huge coordinates</title>
  <desc id="la01-near-desc">Two panels with b1=(1,0) and b2=(1,ε). For ε=0.5 the point (0,1) needs coordinates (−2,2); for ε=0.25 it needs (−4,4). The dashed path walks far left along b1 and back along b2, and the purple coordinate cells become long and thin.</desc>
