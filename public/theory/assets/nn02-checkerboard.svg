<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="nn02-cb-title nn02-cb-desc">
  <title id="nn02-cb-title">The 8+8 checkerboard and a 19-unit network</title>
  <desc id="nn02-cb-desc">Left: the window from 0 to 8 in both coordinates, cut by eight vertical and eight horizontal lines at 0.5, 1.5, …, 7.5 into 81 cells; the 40 cells where k + m is odd are shaded, by evaluating the network below on a grid. Right: the network. Sixteen line units v1 to v8 = θ(x1 − a_i) and u1 to u8 = θ(x2 − a_j) feed two units A and B with alternating weights +1, −1, +1, …, so both read p1 + p2, the sum of the two alternating sums; A has bias −1 and B bias −2. The output has weight +1 from A, −1 from B and bias −1. 19 units and 50 connections, strictly layered.</desc>
  <rect width="900" height="540" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">An exact 8+8 checkerboard with 19 threshold units</text>
