<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="nn01-turing-title nn01-turing-desc">
  <title id="nn01-turing-title">Turing's A-type unit and B-type link</title>
  <desc id="nn01-turing-desc">Left: an A-type unit, a NAND gate with two randomly chosen inputs. Middle: a B-type link, a small device on a connection from D to E controlled by a modifier C. Right: its two modes, on, where E is NOT D, and off, where E is stuck at 1.</desc>
  <rect width="900" height="410" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Turing's unorganised machines</text>
  <circle cx="160" cy="210" r="34" fill="#08111f" stroke="#ffb86b" stroke-width="2.4"/>
  <text x="160" y="215" fill="#e8eef7" font-family="system-ui" font-size="15" text-anchor="middle">NAND</text>
  <path d="M60 170L120.58 191.64" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M130 195L118.9 196.35L122.26 186.93Z" fill="#50d2c2"/>
  <path d="M60 250L120.58 228.36" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M130 225L122.26 233.07L118.9 223.65Z" fill="#50d2c2"/>
  <path d="M194 210L250 210" stroke="#e8eef7" stroke-width="2.2" fill="none"/><path d="M260 210L250 215L250 205Z" fill="#e8eef7"/>
  <text x="160" y="290" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle" font-weight="600">A-type unit</text>
  <text x="160" y="312" fill="#91a4bb" font-family="system-ui" font-size="13" text-anchor="middle">two inputs, chosen at random;</text>
  <text x="160" y="330" fill="#91a4bb" font-family="system-ui" font-size="13" text-anchor="middle">output = NAND one tick later</text>
  <rect x="380" y="160" width="200" height="100" rx="10" fill="#08111f" stroke="#d586ff" stroke-width="2.2" stroke-dasharray="6 4"/>
  <text x="480" y="150" fill="#d586ff" font-family="system-ui" font-size="14" text-anchor="middle">B-type link</text>
  <path d="M320 210L410 210" stroke="#50d2c2" stroke-width="2.2" fill="none"/><path d="M420 210L410 215L410 205Z" fill="#50d2c2"/>
  <text x="330" y="200" fill="#e8eef7" font-family="system-ui" font-size="14" text-anchor="middle">D</text>
  <circle cx="480" cy="210" r="26" fill="#08111f" stroke="#ffb86b" stroke-width="2.4"/>
  <text x="480" y="215" fill="#e8eef7" font-family="system-ui" font-size="16" text-anchor="middle">?</text>
  <path d="M506 210L640 210" stroke="#e8eef7" stroke-width="2.2" fill="none"/><path d="M650 210L640 215L640 205Z" fill="#e8eef7"/>
  <text x="640" y="200" fill="#e8eef7" font-family="system-ui" font-size="14" text-anchor="middle">E</text>
  <path d="M480 300L480 248" stroke="#d586ff" stroke-width="2.2" fill="none"/><path d="M480 238L485 248L475 248Z" fill="#d586ff"/>
  <text x="480" y="318" fill="#d586ff" font-family="system-ui" font-size="13" text-anchor="middle">modifier C</text>
  <rect x="680" y="120" width="190" height="70" rx="10" fill="#08111f" stroke="#8bd17c" stroke-width="2.2"/>
  <text x="695" y="148" fill="#e8eef7" font-family="system-ui" font-size="15">on:  E = NOT D</text>
  <text x="695" y="172" fill="#91a4bb" font-family="system-ui" font-size="13">passes (negated)</text>
  <rect x="680" y="220" width="190" height="70" rx="10" fill="#08111f" stroke="#ff7a90" stroke-width="2.2"/>
  <text x="695" y="248" fill="#e8eef7" font-family="system-ui" font-size="15">off: E = 1</text>
  <text x="695" y="272" fill="#91a4bb" font-family="system-ui" font-size="13">connection cut</text>
  <text x="775" y="330" fill="#e8eef7" font-family="system-ui" font-size="14" text-anchor="middle">training = setting modifiers</text>
  <text x="450" y="390" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">A NAND unit ignores an input stuck at 1, so the 'off' mode cuts the connection. Learning means choosing the modes.</text>
</svg>
