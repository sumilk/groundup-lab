<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Stratified sampling samples from every group while cluster sampling selects whole groups</title>
  <desc id="desc">On the left, observations are selected within every colored stratum. On the right, two entire clusters are selected while other clusters are unobserved.</desc>
  <rect width="960" height="430" rx="18" fill="#f7fbfc"/>
  <text x="480" y="37" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#173641">Strata spread coverage; clusters concentrate collection</text>
  <line x1="480" y1="67" x2="480" y2="372" stroke="#c4d0d6" stroke-width="2"/>
  <text x="240" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#356f84">stratified sample</text>
  <text x="720" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#604d7d">cluster sample</text>
  <g stroke-width="3">
    <rect x="65" y="105" width="350" height="65" rx="10" fill="#e3f1f8" stroke="#5596b0"/>
    <rect x="65" y="185" width="350" height="65" rx="10" fill="#e5f4e9" stroke="#4e9b77"/>
    <rect x="65" y="265" width="350" height="65" rx="10" fill="#fff0dc" stroke="#c98232"/>
  </g>
  <g fill="#173641">
    <circle cx="120" cy="138" r="7"/><circle cx="200" cy="138" r="7"/><circle cx="310" cy="138" r="7"/>
    <circle cx="145" cy="218" r="7"/><circle cx="250" cy="218" r="7"/><circle cx="365" cy="218" r="7"/>
    <circle cx="105" cy="298" r="7"/><circle cx="225" cy="298" r="7"/><circle cx="335" cy="298" r="7"/>
  </g>
  <text x="240" y="357" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">sample independently inside every stratum</text>
  <g font-family="sans-serif" text-anchor="middle" font-size="14">
    <rect x="535" y="105" width="110" height="95" rx="15" fill="#eee9f6" stroke="#8069a0" stroke-width="4"/>
    <rect x="670" y="105" width="110" height="95" rx="15" fill="#f7f3fa" stroke="#b5a9c6" stroke-width="2"/>
    <rect x="805" y="105" width="110" height="95" rx="15" fill="#eee9f6" stroke="#8069a0" stroke-width="4"/>
    <rect x="535" y="225" width="110" height="95" rx="15" fill="#f7f3fa" stroke="#b5a9c6" stroke-width="2"/>
    <rect x="670" y="225" width="110" height="95" rx="15" fill="#f7f3fa" stroke="#b5a9c6" stroke-width="2"/>
    <rect x="805" y="225" width="110" height="95" rx="15" fill="#f7f3fa" stroke="#b5a9c6" stroke-width="2"/>
    <text x="590" y="155" fill="#604d7d">cluster 1</text><text x="725" y="155" fill="#746d7d">cluster 2</text><text x="860" y="155" fill="#604d7d">cluster 3</text>
    <text x="590" y="275" fill="#746d7d">cluster 4</text><text x="725" y="275" fill="#746d7d">cluster 5</text><text x="860" y="275" fill="#746d7d">cluster 6</text>
  </g>
  <text x="720" y="357" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">select clusters, then observe units within them</text>
  <text x="480" y="401" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">The same group labels can support opposite designs; the inclusion mechanism determines the estimator and variance.</text>
</svg>
