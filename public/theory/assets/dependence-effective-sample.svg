<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="de-title de-desc">
  <title id="de-title">Dependence reduces effective sample size</title>
  <desc id="de-desc">Two rows each contain twenty-four observations. The independent row mixes outcomes throughout, while the dependent row contains long repeated blocks. Although both have twenty-four recorded rows, the dependent row carries fewer independent information units and therefore a noisier average.</desc>
  <rect width="1080" height="420" rx="24" fill="#08111f"/>
  <g font-family="system-ui"><text x="540" y="44" text-anchor="middle" fill="#e8eef7" font-size="21">Same row count, different information</text><text x="55" y="122" fill="#e8eef7" font-size="19">weak dependence</text><text x="55" y="264" fill="#e8eef7" font-size="19">strong dependence</text><text x="55" y="147" fill="#91a4bb" font-size="15">frequent new information</text><text x="55" y="289" fill="#91a4bb" font-size="15">repeated information in blocks</text></g>
  <g transform="translate(255 82)">
    <g fill="#50d2c2"><rect x="0" y="0" width="26" height="62" rx="5"/><rect x="64" y="0" width="26" height="62" rx="5"/><rect x="96" y="0" width="26" height="62" rx="5"/><rect x="160" y="0" width="26" height="62" rx="5"/><rect x="224" y="0" width="26" height="62" rx="5"/><rect x="256" y="0" width="26" height="62" rx="5"/><rect x="352" y="0" width="26" height="62" rx="5"/><rect x="416" y="0" width="26" height="62" rx="5"/><rect x="480" y="0" width="26" height="62" rx="5"/><rect x="512" y="0" width="26" height="62" rx="5"/><rect x="608" y="0" width="26" height="62" rx="5"/><rect x="672" y="0" width="26" height="62" rx="5"/></g>
    <g fill="#d586ff"><rect x="32" y="0" width="26" height="62" rx="5"/><rect x="128" y="0" width="26" height="62" rx="5"/><rect x="192" y="0" width="26" height="62" rx="5"/><rect x="288" y="0" width="26" height="62" rx="5"/><rect x="320" y="0" width="26" height="62" rx="5"/><rect x="384" y="0" width="26" height="62" rx="5"/><rect x="448" y="0" width="26" height="62" rx="5"/><rect x="544" y="0" width="26" height="62" rx="5"/><rect x="576" y="0" width="26" height="62" rx="5"/><rect x="640" y="0" width="26" height="62" rx="5"/><rect x="704" y="0" width="26" height="62" rx="5"/><rect x="736" y="0" width="26" height="62" rx="5"/></g>
  </g>
  <g transform="translate(255 224)">
    <g fill="#50d2c2"><rect x="0" y="0" width="26" height="62" rx="5"/><rect x="32" y="0" width="26" height="62" rx="5"/><rect x="64" y="0" width="26" height="62" rx="5"/><rect x="96" y="0" width="26" height="62" rx="5"/><rect x="256" y="0" width="26" height="62" rx="5"/><rect x="288" y="0" width="26" height="62" rx="5"/><rect x="320" y="0" width="26" height="62" rx="5"/><rect x="352" y="0" width="26" height="62" rx="5"/><rect x="512" y="0" width="26" height="62" rx="5"/><rect x="544" y="0" width="26" height="62" rx="5"/><rect x="576" y="0" width="26" height="62" rx="5"/><rect x="608" y="0" width="26" height="62" rx="5"/></g>
    <g fill="#d586ff"><rect x="128" y="0" width="26" height="62" rx="5"/><rect x="160" y="0" width="26" height="62" rx="5"/><rect x="192" y="0" width="26" height="62" rx="5"/><rect x="224" y="0" width="26" height="62" rx="5"/><rect x="384" y="0" width="26" height="62" rx="5"/><rect x="416" y="0" width="26" height="62" rx="5"/><rect x="448" y="0" width="26" height="62" rx="5"/><rect x="480" y="0" width="26" height="62" rx="5"/><rect x="640" y="0" width="26" height="62" rx="5"/><rect x="672" y="0" width="26" height="62" rx="5"/><rect x="704" y="0" width="26" height="62" rx="5"/><rect x="736" y="0" width="26" height="62" rx="5"/></g>
  </g>
  <g fill="#e8eef7" font-family="system-ui" font-size="17"><text x="255" y="180">24 rows ≈ many information units</text><text x="255" y="322">24 rows ≈ about 6 blocks</text></g>
  <path d="M800 337H1000" stroke="#ffb86b" stroke-width="4"/><path d="M800 337L825 325M800 337L825 349M1000 337L975 325M1000 337L975 349" stroke="#ffb86b" stroke-width="4"/>
  <text x="900" y="372" text-anchor="middle" fill="#ffb86b" font-family="system-ui" font-size="17">larger uncertainty than iid formula</text>
