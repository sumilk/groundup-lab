<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="pc-title pc-desc">
  <title id="pc-title">Probability mass function and cumulative distribution function</title>
  <desc id="pc-desc">The left plot shows masses at zero, one, two, and three. The right plot accumulates the same masses into a nondecreasing step function.</desc>
  <rect width="980" height="420" rx="24" fill="#08111f"/>
  <g stroke="#31445e" stroke-width="2"><path d="M70 330H440M90 350V55M540 330H920M560 350V55"/></g>
  <g stroke="#50d2c2" stroke-width="12"><path d="M135 330V265M225 330V135M315 330V135M405 330V265"/></g>
  <g fill="#50d2c2"><circle cx="135" cy="265" r="8"/><circle cx="225" cy="135" r="8"/><circle cx="315" cy="135" r="8"/><circle cx="405" cy="265" r="8"/></g>
  <g fill="none" stroke="#d586ff" stroke-width="5"><path d="M560 330H625V265H715V135H805V70H895"/></g>
  <g fill="#e8eef7" font-family="system-ui" font-size="20" text-anchor="middle"><text x="255" y="42">PMF: mass at each value</text><text x="735" y="42">CDF: accumulated mass</text></g>
  <g fill="#91a4bb" font-family="system-ui" font-size="17" text-anchor="middle"><text x="255" y="395">bar height = P(X = x)</text><text x="735" y="395">jump size = P(X = x)</text></g>
  <text x="490" y="210" text-anchor="middle" fill="#ffb86b" font-family="system-ui" font-size="28">same distribution</text>
</svg>
