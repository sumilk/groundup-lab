  <path d="M421.20 254.35L421.20 286.33L421.20 301.35L421.20 311.75L421.20 319.02L421.20 324.12L421.20 327.68L421.20 330.18L421.20 331.92L421.20 333.15L421.20 334.00L421.20 334.60L421.20 335.02" stroke="#ffb86b" stroke-width="2" fill="none"/>
  <circle cx="421.20" cy="254.35" r="4" fill="#ffb86b"/>
  <circle cx="421.20" cy="286.33" r="4" fill="#ffb86b"/>
  <circle cx="421.20" cy="301.35" r="4" fill="#ffb86b"/>
