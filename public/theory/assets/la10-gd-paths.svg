  <circle cx="421.20" cy="336.00" r="8" fill="none" stroke="#ffb86b" stroke-width="2.5"/>
  <text x="227" y="124.98" fill="#50d2c2" font-family="system-ui" font-size="14">start 0</text>
  <text x="433.2" y="259.35" fill="#ffb86b" font-family="system-ui" font-size="14">start (1, 1, 1)</text>
  <text x="155" y="364" fill="#50d2c2" font-family="system-ui" font-size="13">x† = (1/3, 4/3, 5/3)</text>
  <text x="381.2" y="364" fill="#ffb86b" font-family="system-ui" font-size="13">(2/3, 5/3, 4/3)</text>
  <text x="450.43" y="326" fill="#e8eef7" font-family="system-ui" font-size="13">every solution of Ax = b</text>
  <text x="630" y="160" fill="#e8eef7" font-family="system-ui" font-size="14">update: −η Aᵀ(Ax − b)</text>
  <text x="630" y="184" fill="#e8eef7" font-family="system-ui" font-size="14">always lies in row(A)</text>
  <text x="630" y="230" fill="#50d2c2" font-family="system-ui" font-size="14">from 0: limit x†</text>
  <text x="630" y="254" fill="#ffb86b" font-family="system-ui" font-size="14">from (1, 1, 1): limit x† +</text>
  <text x="630" y="278" fill="#ffb86b" font-family="system-ui" font-size="14">(1/3)(1, 1, −1), its kernel part</text>
  <text x="630" y="324" fill="#91a4bb" font-family="system-ui" font-size="13">η = 0.3 ≤ 1/σ₁² = 1/3</text>
  <text x="450" y="460" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">The kernel coordinate never changes: every update lies in row(A). Twelve steps are shown from each start.</text>
</svg>
