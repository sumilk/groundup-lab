<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="la10-gd-title la10-gd-desc">
  <title id="la10-gd-title">Gradient descent from two starting points</title>
  <desc id="la10-gd-desc">Gradient descent with step 0.3 on A = [[1, 0, 1], [0, 1, 1]], b = (2, 3). The horizontal axis is the coordinate along the kernel direction (1, 1, −1)/√3 and the vertical axis is the distance of the row-space part of the iterate from the minimum-norm solution. The horizontal axis itself is the set of all solutions. From 0 the iterates drop straight down at kernel coordinate 0 and reach (1/3, 4/3, 5/3). From (1, 1, 1) they drop straight down at kernel coordinate 1/√3 and reach (2/3, 5/3, 4/3).</desc>
  <rect width="900" height="480" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Gradient descent keeps whatever kernel part it starts with</text>
  <path d="M90 336.00L590 336.00" stroke="#173641" stroke-width="1.2"/>
  <text x="80" y="341" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">0</text>
  <path d="M90 236.00L590 236.00" stroke="#173641" stroke-width="1.2"/>
  <text x="80" y="241" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">1</text>
  <path d="M90 136.00L590 136.00" stroke="#173641" stroke-width="1.2"/>
  <text x="80" y="141" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="end">2</text>
  <path d="M215.00 96L215.00 386" stroke="#173641" stroke-width="1.2"/>
  <text x="215" y="408" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">0</text>
  <path d="M393.57 96L393.57 386" stroke="#173641" stroke-width="1.2"/>
  <text x="393.57" y="408" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">0.5</text>
  <path d="M572.14 96L572.14 386" stroke="#173641" stroke-width="1.2"/>
  <text x="572.14" y="408" fill="#a8b7ca" font-family="system-ui" font-size="13" text-anchor="middle">1</text>
  <path d="M90 386L590 386M90 96L90 386" stroke="#31445e" stroke-width="2"/>
  <text x="340" y="432" fill="#a8b7ca" font-family="system-ui" font-size="14" text-anchor="middle">coordinate along ker A = span(1, 1, −1)</text>
  <text x="90" y="82" fill="#a8b7ca" font-family="system-ui" font-size="14">distance of the row-space part from x†</text>
  <path d="M90 336.00L590 336.00" stroke="#e8eef7" stroke-width="2.5" stroke-dasharray="1 0"/>
  <path d="M215.00 119.98L215.00 282.46L215.00 301.29L215.00 311.75L215.00 319.02L215.00 324.12L215.00 327.68L215.00 330.18L215.00 331.92L215.00 333.15L215.00 334.00L215.00 334.60L215.00 335.02" stroke="#50d2c2" stroke-width="2" fill="none"/>
