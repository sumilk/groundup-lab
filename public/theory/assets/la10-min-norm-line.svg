<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="la10-line-title la10-line-desc">
  <title id="la10-line-title">The shortest solution of x1 + 2x2 = 5</title>
  <desc id="la10-line-desc">The solution line of x1 + 2x2 = 5 is drawn with the row-space line through the origin in direction (1, 2). They meet at right angles at (1, 2), which is also where the smallest circle about the origin touches the solution line. The solution (5, 0), with the free variable set to zero, lies farther out on the same line. Moving along (2, −1) stays on the line.</desc>
  <rect width="900" height="430" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Which solution is shortest?</text>
