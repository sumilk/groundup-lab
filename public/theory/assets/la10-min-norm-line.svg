  <text x="188.48" y="169.3" fill="#50d2c2" font-family="system-ui" font-size="17">(1, 2)</text>
  <text x="501.35" y="319.74" fill="#ff7a90" font-family="system-ui" font-size="17">(5, 0)</text>
  <text x="398.91" y="216.52" fill="#ffb86b" font-family="system-ui" font-size="15">move by (2, −1)</text>
  <text x="382.39" y="102.61" fill="#91a4bb" font-family="system-ui" font-size="14">dashed: row space, multiples of (1, 2)</text>
  <text x="415" y="251.3" fill="#50d2c2" font-family="system-ui" font-size="15">x₁ + 2x₂ = 5</text>
  <text x="650" y="150" fill="#a8b7ca" font-family="system-ui" font-size="15">Every solution:</text>
  <text x="650" y="176" fill="#50d2c2" font-family="system-ui" font-size="16">(1, 2) + t(2, −1)</text>
  <text x="650" y="222" fill="#a8b7ca" font-family="system-ui" font-size="15">Squared length:</text>
  <text x="650" y="248" fill="#e8eef7" font-family="system-ui" font-size="16">5 + 5t²</text>
  <text x="650" y="294" fill="#50d2c2" font-family="system-ui" font-size="15">t = 0 → (1, 2), length² 5</text>
  <text x="650" y="320" fill="#ff7a90" font-family="system-ui" font-size="15">t = 2 → (5, 0), length² 25</text>
  <text x="450" y="410" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Moving along (2, −1) never changes x₁ + 2x₂; the circle of radius √5 touches the line only at (1, 2).</text>
