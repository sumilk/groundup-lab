  <title id="nn01-twosq-title">Two squares, six fences: sharing edges</title>
  <desc id="nn01-twosq-desc">Left: two shaded squares, from −3 to −1 and from 1 to 3 along x1, both between −1 and 1 along x2, with the shared top and bottom lines labelled t and u. Right: a 2–6–2–1 network. Units a1, a2 bound the left square, b1, b2 the right one, and t, u are read by both AND units A and B; the output ORs A and B.</desc>
