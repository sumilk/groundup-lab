<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="la02-rref-title la02-rref-desc">
  <title id="la02-rref-title">The worked 3×4 elimination, one stage per matrix</title>
  <desc id="la02-rref-desc">Four augmented matrices joined by arrows. From [1 2 1 3 | 4; 2 4 4 10 | 10; 1 2 −1 −1 | 2], the operations R2 − 2R1 and R3 − R1 give [1 2 1 3 | 4; 0 0 2 4 | 2; 0 0 −2 −4 | −2]; R3 + R2 gives a zero third row; halving R2 and R1 − R2 give the RREF [1 2 0 1 | 3; 0 0 1 2 | 1; 0 0 0 0 | 0]. Pivots are boxed and the free columns 2 and 4 are shaded.</desc>
