<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">A p-value is tail area beyond an observed test statistic under the null model</title>
  <desc id="desc">A bell-shaped null distribution is shown with an observed statistic to the right. The area at least as extreme as the observation is shaded.</desc>
  <rect width="920" height="360" rx="18" fill="#f7fbfc"/>
  <text x="460" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#173641">Reason from the null model outward</text>
  <line x1="86" y1="286" x2="850" y2="286" stroke="#476073" stroke-width="2"/>
  <path d="M95 286 C210 285 245 275 305 226 C363 178 395 86 460 74 C525 86 557 178 615 226 C675 275 710 285 825 286" fill="none" stroke="#176b71" stroke-width="5"/>
  <path d="M666 259 C720 281 761 285 825 286 L825 286 L666 286 Z" fill="#f39b72" opacity="0.78"/>
  <line x1="666" y1="89" x2="666" y2="291" stroke="#a53d36" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="666" y="73" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#8e302c">observed statistic</text>
  <text x="739" y="230" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#69241f">p-value</text>
  <text x="739" y="252" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#69241f">null probability of this</text>
  <text x="739" y="271" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#69241f">result or something more extreme</text>
  <text x="460" y="326" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#35566a">possible test-statistic values if the null model generated a fresh dataset</text>
</svg>
