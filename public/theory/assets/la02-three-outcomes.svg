<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="la02-out-title la02-out-desc">
  <title id="la02-out-title">Three outcomes for a 2×2 system</title>
