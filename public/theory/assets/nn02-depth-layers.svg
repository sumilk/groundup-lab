<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="nn02-depth-title nn02-depth-desc">
  <title id="nn02-depth-title">Depth and strict layering for a two-unit XOR</title>
  <desc id="nn02-depth-desc">Left: inputs x1 and x2, hidden unit h = θ(x1 + x2 − 2) and output y = θ(x1 + x2 − 2h − 1). The output reads both inputs directly through skip connections and reads h with weight −2. Depths 0, 0, 1 and 2 are written beside x1, x2, h and y; 2 units and 5 connections. Right: the same function strictly layered, with copying units p1 = θ(x1 − ½) and p2 = θ(x2 − ½) beside h, and y = θ(p1 + p2 − 2h − 1); every arrow joins neighbouring columns; 4 units and 7 connections. Both networks are checked on all four inputs.</desc>
