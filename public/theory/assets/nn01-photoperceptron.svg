  <title id="nn01-photo-title">Rosenblatt's photoperceptron</title>
  <desc id="nn01-photo-desc">A six by six retina of sensory points on the left feeds a column of projection units through random connections, which feed a column of association units, which feed two response units. The two responses inhibit each other.</desc>
