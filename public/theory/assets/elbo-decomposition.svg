<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="elbo-title elbo-desc">
  <title id="elbo-title">The log evidence splits into the ELBO plus a KL gap, and the two gradient estimators differ sharply in spread</title>
  <desc id="elbo-desc">Left panel: two stacked bars of equal total height represent the log evidence. In the first bar a large upper portion is the KL divergence from the variational distribution to the true posterior and a smaller lower portion is the ELBO. In the second bar the KL portion has shrunk and the ELBO portion has grown, showing that maximizing the bound tightens the posterior approximation without changing the total. Right panel: sample gradient estimates from the score-function estimator are widely scattered around the true value, while pathwise estimates cluster tightly on it.</desc>
  <rect width="1080" height="460" rx="24" fill="#08111f"/>
  <g font-family="system-ui">
    <text x="540" y="40" text-anchor="middle" fill="#e8eef7" font-size="21">One identity, one variance problem</text>

    <g>
      <text x="90" y="82" fill="#e8eef7" font-size="18">log p(x) = ELBO + KL gap</text>
      <text x="90" y="104" fill="#91a4bb" font-size="14">the total never moves; the split does</text>

      <path d="M90 140H74V390H90" fill="none" stroke="#31445e" stroke-width="3"/>
      <text x="62" y="270" fill="#91a4bb" font-size="14" transform="rotate(-90 62 270)" text-anchor="middle">log p(x)</text>

      <rect x="120" y="140" width="120" height="104" rx="6" fill="#7aa2f7" fill-opacity=".55"/>
      <rect x="120" y="248" width="120" height="142" rx="6" fill="#50d2c2" fill-opacity=".55"/>
      <text x="180" y="198" text-anchor="middle" fill="#e8eef7" font-size="15">KL gap</text>
      <text x="180" y="328" text-anchor="middle" fill="#e8eef7" font-size="15">ELBO</text>
      <text x="180" y="414" text-anchor="middle" fill="#91a4bb" font-size="14">loose q</text>

      <path d="M268 265H322" stroke="#e8eef7" stroke-width="3"/>
      <path d="M312 255L324 265L312 275" fill="none" stroke="#e8eef7" stroke-width="3"/>
      <text x="295" y="245" text-anchor="middle" fill="#91a4bb" font-size="13">maximize</text>

      <rect x="350" y="140" width="120" height="36" rx="6" fill="#7aa2f7" fill-opacity=".55"/>
      <rect x="350" y="180" width="120" height="210" rx="6" fill="#50d2c2" fill-opacity=".55"/>
      <text x="410" y="164" text-anchor="middle" fill="#e8eef7" font-size="15">KL gap</text>
      <text x="410" y="296" text-anchor="middle" fill="#e8eef7" font-size="15">ELBO</text>
      <text x="410" y="414" text-anchor="middle" fill="#91a4bb" font-size="14">tighter q</text>
    </g>

    <g>
      <text x="600" y="82" fill="#e8eef7" font-size="18">Same gradient, different spread</text>
      <text x="600" y="104" fill="#91a4bb" font-size="14">single-sample estimates of the same quantity</text>

      <path d="M600 330H1010" stroke="#31445e" stroke-width="3"/>
      <path d="M805 150V350" stroke="#e8eef7" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="805" y="372" text-anchor="middle" fill="#e8eef7" font-size="14">true gradient</text>

      <g fill="#7aa2f7" fill-opacity=".85">
        <circle cx="642" cy="180" r="6"/><circle cx="706" cy="196" r="6"/><circle cx="752" cy="172" r="6"/>
        <circle cx="838" cy="200" r="6"/><circle cx="896" cy="176" r="6"/><circle cx="960" cy="194" r="6"/>
        <circle cx="682" cy="214" r="6"/><circle cx="930" cy="214" r="6"/><circle cx="790" cy="188" r="6"/>
      </g>
      <text x="600" y="150" fill="#7aa2f7" font-size="15">score function: variance μ² + 2</text>

      <g fill="#50d2c2">
        <circle cx="805" cy="270" r="6"/><circle cx="805" cy="270" r="6"/><circle cx="803" cy="286" r="6"/>
        <circle cx="807" cy="254" r="6"/><circle cx="805" cy="302" r="6"/><circle cx="806" cy="238" r="6"/>
      </g>
      <text x="600" y="276" fill="#50d2c2" font-size="15">pathwise: variance 0</text>
    </g>
  </g>
</svg>
