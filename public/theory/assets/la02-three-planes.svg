<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="la02-planes-title la02-planes-desc">
  <title id="la02-planes-title">A 3×3 system: three planes meet in one point; three columns build b</title>
  <desc id="la02-planes-desc">Left: an oblique view with x, y and z axes of patches of the planes 2x + y + z = 3, 4x + y = 6 and −2x + 2y + z = 1, all passing through (1, 2, −1); a dashed drop line connects that point to the floor z = 0. Right: the tip-to-tail path a1 = (2,4,−2), then plus 2a2 with a2 = (1,1,2), then minus a3 with a3 = (1,0,1), ending at b = (3,6,1).</desc>
  <rect width="900" height="440" rx="24" fill="#08111f"/>
  <defs><clipPath id="clip-30-70"><rect x="115.58" y="70" width="268.84" height="320"/></clipPath></defs>
