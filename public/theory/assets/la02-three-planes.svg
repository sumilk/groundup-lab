  <text x="756" y="282.69" fill="#e8eef7" font-family="system-ui" font-size="15">b = (3, 6, 1)</text>
  <text x="450" y="420" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Pivots 2, −1, −4 are all nonzero, so the planes share exactly one point.</text>
