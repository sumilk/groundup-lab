  <path d="M287.73 248.04L203.96 188.3L203.96 314.67L287.73 374.4Z" fill="#ffb86b" fill-opacity="0.22" stroke="#ffb86b" stroke-width="1.5"/>
  <path d="M253.31 183.51L193.96 250.16L238.39 379.19L297.74 312.54Z" fill="#d586ff" fill-opacity="0.22" stroke="#d586ff" stroke-width="1.5"/>
  <path d="M245.85 281.35L245.85 234.55" stroke="#91a4bb" stroke-width="1.5" stroke-dasharray="3 4" fill="none"/>
  <circle cx="245.85" cy="234.55" r="3" fill="#91a4bb"/>
  <circle cx="245.85" cy="281.35" r="6" fill="#e8eef7"/>
