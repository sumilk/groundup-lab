  <text x="40" y="320" fill="#50d2c2" font-family="system-ui" font-size="14">■ 2x + y + z = 3</text>
  <text x="40" y="340" fill="#ffb86b" font-family="system-ui" font-size="14">■ 4x + y = 6</text>
  <text x="40" y="360" fill="#d586ff" font-family="system-ui" font-size="14">■ −2x + 2y + z = 1</text>
  <defs><clipPath id="clip-490-70"><rect x="490" y="84.98" width="380" height="290.03"/></clipPath></defs>
  <text x="680" y="56" fill="#a8b7ca" font-family="system-ui" font-size="17" text-anchor="middle">column picture: 1·a₁ + 2·a₂ − 1·a₃ = b</text>
