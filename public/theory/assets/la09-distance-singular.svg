<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="la09-dist-title la09-dist-desc">
  <title id="la09-dist-title">Distance to a singular matrix is the smallest singular value</title>
  <desc id="la09-dist-desc">Left: A = R diag(1.5, 0.5) maps the unit circle to an ellipse with semi-axes 1.5 and 0.5. Right: subtracting the rank-one piece 0.5 u2 v2 transpose flattens the ellipse onto a segment of half-length 1.5, so the perturbed matrix is singular.</desc>
  <rect width="900" height="430" rx="24" fill="#08111f"/>
