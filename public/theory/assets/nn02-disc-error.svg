<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="nn02-disc-title nn02-disc-desc">
  <title id="nn02-disc-title">Disagreement area of polygons with the unit disc</title>
  <desc id="nn02-disc-desc">Log–log plot of disagreement area against the number of sides N from 3 to 128. The circumscribed polygon's error N tan(π/N) − π (teal) and the inscribed polygon's error π − (N/2) sin(2π/N) (orange) both fall with slope −2, the inscribed line about twice as high. A dashed asymptote π³/(3N²) lies on the circumscribed line. Marked values: N = 8 gives 0.1721 circumscribed and 0.3132 inscribed; N = 33 gives 0.0095 circumscribed.</desc>
