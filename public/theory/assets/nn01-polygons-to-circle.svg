<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="nn01-poly-title nn01-poly-desc">
  <title id="nn01-poly-title">Regular polygons approaching the unit circle</title>
  <desc id="nn01-poly-desc">Four panels with a dashed unit circle and a shaded regular polygon around it, with 3, 6, 12 and 48 sides. Below each, the number of threshold units and how much larger the polygon's area is than the circle's: 65.4, 10.3, 2.3 and 0.1 percent.</desc>
