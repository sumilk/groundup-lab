<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img" aria-labelledby="nn02-saw-title nn02-saw-desc">
  <title id="nn02-saw-title">The sawtooth and its deep network</title>
  <desc id="nn02-saw-desc">Top: the tent map t(x) = 2 min(x, 1 − x) on [0, 1] and its compositions t∘t and t∘t∘t, with 1, 2 and 4 teeth and 2, 4 and 8 linear pieces. Bottom left: the deep ReLU network for k = 3. Input x feeds a first layer computing ReLU(x) and ReLU(x − ½); each later layer reads its two inputs with weights 2 and −4 and computes ReLU(z) and ReLU(z − ½); the output is 2a3 − 4b3. It has 6 hidden units in 3 layers of width 2 and is checked against t∘t∘t. Bottom right: t∘t∘t with a dashed line at ½ and its 8 crossings of that level marked.</desc>
  <rect width="900" height="580" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Folding doubles the teeth; a shallow network must add them one at a time</text>
