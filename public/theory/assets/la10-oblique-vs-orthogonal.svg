<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="la10-obl-title la10-obl-desc">
  <title id="la10-obl-title">An oblique inverse and the pseudoinverse</title>
  <desc id="la10-obl-desc">For A = [[1, 1], [2, 2]], the point w = (0.5, 0.9) and every point on the dashed line through it in direction (1, −1) give the same Aw. The pseudoinverse product A+A moves w perpendicularly onto the row-space line to (0.7, 0.7). The free-variable-zero inverse G = [[1/5, 2/5], [0, 0]] gives GA w = (1.4, 0), reached by moving along the same dashed line but not perpendicularly to the row space.</desc>
  <rect width="900" height="450" rx="24" fill="#08111f"/>
  <text x="450" y="44" fill="#a8b7ca" font-family="system-ui" font-size="18" text-anchor="middle">Same fit, different representative</text>
