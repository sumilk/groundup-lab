  <text x="650" y="244" fill="#ff7a90" font-family="system-ui" font-size="14">not symmetric: slanted drop</text>
  <text x="650" y="300" fill="#e8eef7" font-family="system-ui" font-size="15">length 0.99 vs 1.40</text>
  <text x="450" y="430" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Both moves stay on the dashed line, so neither changes Aw. Only A⁺A is symmetric, and only it lands on the shortest point.</text>
