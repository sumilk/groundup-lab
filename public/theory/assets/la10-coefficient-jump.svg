<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="la10-jump-title la10-jump-desc">
  <title id="la10-jump-title">The coefficient jump lies along the weak direction</title>
  <desc id="la10-jump-desc">Coefficient space for the near-collinear fit. The coefficients (1, 1) generate X(1, 1) = (2, 4.01, 5.99). The fitted coefficients (−3, 5) differ from (1, 1) by about −5.66 times v2, the weak right-singular direction (0.707, −0.707). Moving two observations by 0.01 moves the fit again along v2, to (−4, 6).</desc>
