  <title id="la01-axioms-title">Axiom 7 as a scaled parallelogram, and an operation that fails axiom 8</title>
  <desc id="la01-axioms-desc">Left: the parallelogram on u=(1,2) and v=(2,−1) and the same parallelogram scaled by 2, whose diagonal is 2(u+v)=(6,2). Right: with the rule a⋆w=|a|w for w=(2,1), 1⋆w plus (−1)⋆w lands at (4,2), but (1+(−1))⋆w is the origin.</desc>
