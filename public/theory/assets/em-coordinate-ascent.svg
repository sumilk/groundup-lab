    <line x1="284.2" y1="363.1" x2="284.2" y2="460.0" stroke="#31445e" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="466.4" y1="280.3" x2="466.4" y2="460.0" stroke="#31445e" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="603.0" y1="233.8" x2="603.0" y2="460.0" stroke="#31445e" stroke-width="2" stroke-dasharray="5 5"/>

    <path d="M475.4 280.3H500.4M475.4 315.8H500.4M496.4 280.3V315.8" stroke="#91a4bb" stroke-width="2" fill="none"/>
    <text x="508" y="303" fill="#91a4bb" font-size="14">gap = KL(qᵗ ‖ new posterior)</text>

    <circle cx="284.2" cy="363.1" r="7" fill="#50d2c2"/>
    <circle cx="466.4" cy="280.3" r="7" fill="#f2b880"/>
    <circle cx="466.4" cy="315.8" r="6" fill="#0e1b2d" stroke="#50d2c2" stroke-width="3"/>

    <text x="266" y="196" text-anchor="end" fill="#50d2c2" font-size="17">E-step</text>
    <text x="266" y="220" text-anchor="end" fill="#91a4bb" font-size="14">q ← p(z | x, θ⁽ᵗ⁾)</text>
    <text x="266" y="242" text-anchor="end" fill="#91a4bb" font-size="14">KL becomes 0, so the</text>
    <text x="266" y="262" text-anchor="end" fill="#91a4bb" font-size="14">bound touches the curve</text>
    <path d="M274.2 236Q286.2 300 282.2 349.1" stroke="#50d2c2" stroke-width="3" fill="none" marker-end="url(#em-tip)"/>

    <path d="M298.2 403.1H452.4" stroke="#f2b880" stroke-width="3.5" fill="none" marker-end="url(#em-tip-b)"/>
    <text x="375" y="429" text-anchor="middle" fill="#f2b880" font-size="16">M-step</text>
    <text x="375" y="451" text-anchor="middle" fill="#91a4bb" font-size="14">maximize the bound</text>

    <text x="284" y="486.0" text-anchor="middle" fill="#e8eef7" font-size="15">θ⁽ᵗ⁾</text>
    <text x="466" y="486.0" text-anchor="middle" fill="#e8eef7" font-size="15">θ⁽ᵗ⁺¹⁾</text>
    <text x="603" y="486.0" text-anchor="middle" fill="#91a4bb" font-size="15">θ⁽ᵗ⁺²⁾</text>

    <text x="630" y="382" fill="#50d2c2" font-size="15">bound at step t</text>
    <text x="785" y="329" fill="#f2b880" font-size="15">bound at step t+1</text>

    <text x="540" y="528" text-anchor="middle" fill="#91a4bb" font-size="15">The bound never crosses the curve, so climbing the bound can never lower the log-likelihood.</text>
  </g>
</svg>
