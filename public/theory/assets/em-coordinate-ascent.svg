<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="em-title em-desc">
  <title id="em-title">EM alternates between lifting the bound until it touches the log-likelihood and climbing the bound</title>
  <desc id="em-desc">A rising concave curve is the log-likelihood as a function of the parameter. Two lower curves are evidence lower bounds. The first touches the log-likelihood at the current parameter, which is what the E-step achieves by setting q to the exact posterior; the M-step then moves to that bound's maximum, and the log-likelihood there is higher still, the remaining gap being the KL divergence between the old posterior and the new one. A second bound is drawn touching at the new parameter, showing the next iteration. Because each bound lies below the log-likelihood everywhere and touches at the current parameter, the log-likelihood cannot decrease.</desc>
  <defs>
    <marker id="em-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#50d2c2"/>
    </marker>
    <marker id="em-tip-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f2b880"/>
    </marker>
  </defs>
  <rect width="1080" height="560" rx="24" fill="#08111f"/>
  <g font-family="system-ui">
    <text x="540" y="42" text-anchor="middle" fill="#e8eef7" font-size="21">One EM iteration: make the bound tight, then climb it</text>

