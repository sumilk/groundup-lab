<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="la10-pjump-title la10-pjump-desc">
  <title id="la10-pjump-title">The pseudoinverse is discontinuous at a rank change</title>
  <desc id="la10-pjump-desc">The 2-norm of the pseudoinverse of A(epsilon) = [[1, 1], [1, 1 + epsilon]] is plotted on a logarithmic axis against epsilon from −0.5 to 0.5. It grows like 2 over the absolute value of epsilon as epsilon approaches zero, about 20.5 at epsilon 0.1 and 200.5 at 0.01, but at epsilon = 0 the matrix has rank one and the norm is exactly 1/2.</desc>
