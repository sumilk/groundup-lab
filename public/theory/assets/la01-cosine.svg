<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="la01-cos-title la01-cos-desc">
  <title id="la01-cos-title">The dot product measures angle and overlap</title>
  <desc id="la01-cos-desc">Left: u=(2,1) and v=(1,3) meet at 45 degrees; dropping a perpendicular from v to the line of u lands exactly at u, so the shadow has length √5. Right: three unit vectors 120 degrees apart; the activation x=f1+f2 reads 1/2 on f1 and on f2, and −1 on the inactive f3.</desc>
  <rect width="920" height="430" rx="24" fill="#08111f"/>
