<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Bootstrap resampling approximates repeated sampling</title>
  <desc id="desc">One observed sample is treated as an empirical population. Many same-size samples are drawn with replacement and an estimate is computed from each.</desc>
  <rect width="960" height="420" rx="18" fill="#f7fbfc"/>
  <text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#173641">One dataset becomes a resampling population</text>
  <rect x="45" y="105" width="210" height="210" rx="14" fill="#e6f5f3" stroke="#27766f" stroke-width="2"/>
  <text x="150" y="88" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#245f5b">observed sample</text>
  <g font-family="sans-serif" font-size="17" text-anchor="middle">
    <circle cx="95" cy="160" r="25" fill="#60b9aa"/><text x="95" y="166" fill="#092f31">2</text>
    <circle cx="160" cy="160" r="25" fill="#86c7b9"/><text x="160" y="166" fill="#092f31">4</text>
    <circle cx="215" cy="220" r="25" fill="#a8d8ce"/><text x="215" y="226" fill="#092f31">7</text>
    <circle cx="115" cy="255" r="25" fill="#d5eee9"/><text x="115" y="261" fill="#092f31">9</text>
  </g>
  <path d="M270 210 H350" stroke="#476073" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="310" y="187" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">sample n values</text>
  <text x="310" y="235" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">with replacement</text>
  <g font-family="sans-serif" font-size="15">
    <rect x="370" y="77" width="220" height="72" rx="10" fill="#e9f1fa" stroke="#547ca1"/>
    <text x="390" y="106" fill="#35566a">2, 2, 7, 9</text><text x="520" y="106" fill="#173641" font-weight="700">estimate 5.0</text>
    <rect x="370" y="170" width="220" height="72" rx="10" fill="#e9f1fa" stroke="#547ca1"/>
    <text x="390" y="199" fill="#35566a">4, 7, 7, 9</text><text x="520" y="199" fill="#173641" font-weight="700">estimate 6.75</text>
    <rect x="370" y="263" width="220" height="72" rx="10" fill="#e9f1fa" stroke="#547ca1"/>
    <text x="390" y="292" fill="#35566a">9, 2, 9, 2</text><text x="520" y="292" fill="#173641" font-weight="700">estimate 5.5</text>
  </g>
  <text x="480" y="365" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">repeat B times</text>
  <path d="M610 210 H685" stroke="#476073" stroke-width="3" marker-end="url(#arrow)"/>
  <g transform="translate(700 82)">
    <line x1="0" y1="250" x2="205" y2="250" stroke="#476073" stroke-width="2"/>
    <rect x="10" y="205" width="18" height="45" fill="#70b7ca"/>
    <rect x="31" y="150" width="18" height="100" fill="#55a7bd"/>
    <rect x="52" y="92" width="18" height="158" fill="#338ca7"/>
    <rect x="73" y="42" width="18" height="208" fill="#176b71"/>
    <rect x="94" y="22" width="18" height="228" fill="#176b71"/>
    <rect x="115" y="57" width="18" height="193" fill="#267f93"/>
    <rect x="136" y="112" width="18" height="138" fill="#4199ae"/>
    <rect x="157" y="173" width="18" height="77" fill="#62b0c2"/>
    <rect x="178" y="218" width="18" height="32" fill="#8cc7d2"/>
    <text x="103" y="-13" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#245f5b">bootstrap estimates</text>
    <text x="103" y="278" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#476073">approximate sampling distribution</text>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#476073"/></marker></defs>
</svg>
