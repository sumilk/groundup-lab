  <text x="630" y="150" fill="#50d2c2" font-family="system-ui" font-size="15">■ x + y + z = 3</text>
  <text x="630" y="176" fill="#ffb86b" font-family="system-ui" font-size="15">■ x + 2y + 3z = 4</text>
  <text x="630" y="216" fill="#a8b7ca" font-family="system-ui" font-size="14">The planes meet in the solid line.</text>
  <text x="630" y="240" fill="#a8b7ca" font-family="system-ui" font-size="14">It is parallel to the dashed null</text>
  <text x="630" y="262" fill="#a8b7ca" font-family="system-ui" font-size="14">line and passes through xₚ.</text>
  <text x="630" y="300" fill="#91a4bb" font-family="system-ui" font-size="14">Axes are drawn over the planes;</text>
  <text x="630" y="322" fill="#91a4bb" font-family="system-ui" font-size="14">xₚ lies on the floor z = 0.</text>
  <text x="450" y="420" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Same direction, different position: the solution line is the null-space line shifted to pass through xₚ.</text>
