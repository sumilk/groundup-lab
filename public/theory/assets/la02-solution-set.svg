<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="la02-sol-title la02-sol-desc">
  <title id="la02-sol-title">The solution set is a particular point plus the null space</title>
  <desc id="la02-sol-desc">An oblique view with x, y and z axes. Strips of the planes x + y + z = 3 and x + 2y + 3z = 4 meet along a solid line through xp = (2, 1, 0). A dashed line through the origin, spanned by s = (1, −2, 1), is the null space; the solution line is parallel to it.</desc>
