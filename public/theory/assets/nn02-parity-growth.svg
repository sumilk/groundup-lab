<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="nn02-pgrowth-title nn02-pgrowth-desc">
  <title id="nn02-pgrowth-title">Parity network sizes on a logarithmic axis</title>
  <desc id="nn02-pgrowth-desc">Units (solid) and connections (dashed) against n from 2 to 16, on a logarithmic vertical axis from 1 to one million. DNF: 2^(n−1)+1 units and (n+1)·2^(n−1) connections, straight lines reaching 32769 units and 557056 connections at n = 16. Counting: n+1 units and n²+n connections. XOR tree: 3(n−1) units and 6(n−1) connections. The counting and tree curves stay below a few hundred.</desc>
