<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-labelledby="nn02-spn-title nn02-spn-desc">
  <title id="nn02-spn-title">Product of sums versus sum of products</title>
  <desc id="nn02-spn-desc">Left: inputs x1 to x6 feed three sum units computing x1+x2, x3+x4 and x5+x6, which feed one product unit: 4 units. Right: the expanded form, found by choosing one variable from each bracket: 8 product units for the monomials x1x3x5, x1x3x6, x1x4x5, x1x4x6, x2x3x5, x2x3x6, x2x4x5, x2x4x6, each reading three inputs, feeding one sum unit: 9 units. Both have depth 2 and are checked to compute the same polynomial.</desc>
