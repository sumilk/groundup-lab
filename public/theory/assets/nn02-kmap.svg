<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="nn02-kmap-title nn02-kmap-desc">
  <title id="nn02-kmap-title">Karnaugh map grouping and the reduced network</title>
  <desc id="nn02-kmap-desc">A four-by-four Karnaugh map with rows AB and columns CD in Gray-code order 00, 01, 11, 10; each cell shows its row number ABCD and the value of f, which is 1 on rows 0, 1, 2, 3, 5, 7, 8, 10, 13, 15. Three groups are outlined: B̄D̄ (pattern -0-0, rows 0, 2, 8, 10) wraps around the four corners; BD (pattern -1-1, rows 5, 7, 13, 15) is the middle two-by-two block; ĀD (pattern 0--1, rows 1, 3, 5, 7) is the two-by-two block in the top two rows and middle two columns. Beside it, the reduced network: AND unit B̄D̄ with weights −1 on B and D and bias 0, AND unit BD with weights +1 on B and D and bias −2, AND unit ĀD with weight −1 on A, +1 on D and bias −1, and an OR output with bias −1. Input C is not read. 4 units in total, checked on all 16 rows.</desc>
