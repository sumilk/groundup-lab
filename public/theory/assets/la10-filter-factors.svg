  <text x="658" y="150" fill="#50d2c2" font-family="system-ui" font-size="14">truncation, τ = 10⁻²</text>
  <path d="M620 171L648 171" stroke="#ffb86b" stroke-width="3.5"/>
  <text x="658" y="176" fill="#ffb86b" font-family="system-ui" font-size="14">ridge, λ = 10⁻⁴</text>
  <path d="M620 197L648 197" stroke="#d586ff" stroke-width="3.5" stroke-dasharray="8 5"/>
  <text x="658" y="202" fill="#d586ff" font-family="system-ui" font-size="14">gradient descent, η = 1,</text>
  <text x="658" y="224" fill="#d586ff" font-family="system-ui" font-size="14">t = 10⁴ steps (dotted: 10², 10⁶)</text>
  <text x="620" y="280" fill="#e8eef7" font-family="system-ui" font-size="14">ridge: f = σ²/(σ² + λ)</text>
  <text x="620" y="306" fill="#e8eef7" font-family="system-ui" font-size="14">GD: f = 1 − (1 − ησ²)ᵗ</text>
  <text x="620" y="332" fill="#91a4bb" font-family="system-ui" font-size="13">t ≈ 1/(ηλ) puts both near σ ≈ √λ</text>
  <text x="450" y="460" text-anchor="middle" fill="#91a4bb" font-family="system-ui" font-size="16">Channel i contributes fᵢ · uᵢᵀb/σᵢ along vᵢ. Strong channels pass (f ≈ 1); weak ones are cut or damped.</text>
