<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="la10-filt-title la10-filt-desc">
  <title id="la10-filt-title">Filter factors of truncation, ridge and gradient descent</title>
  <desc id="la10-filt-desc">Filter factor against singular value on a logarithmic axis from 10 to the minus 4 to 1. Truncation at tolerance 0.01 is a step from 0 to 1 at sigma = 0.01. Ridge with lambda = 10 to the minus 4 rises smoothly as sigma squared over sigma squared plus lambda, passing 1/2 at sigma = 0.01. Gradient descent with step 1 after t steps follows 1 minus (1 minus sigma squared) to the power t; at t = 10 to the 4 it is close to the ridge curve, and at t = 10 squared and 10 to the 6 its transition sits at larger and smaller sigma.</desc>
